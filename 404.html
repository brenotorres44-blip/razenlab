<style>:root{--bg:#020A1F;--surface:#0B1C40;--surface-2:#10275A;--ink:#EEF4FF;--muted:#AFC0DE;--accent:#1E9BFF;--accent-ink:#020A1F;--accent-strong:#5CB8FF;

.bar{display:flex;align-items:center;gap:16px;height:72px;padding:0 var(--m);max-width:1520px;margin:0 auto}

.layers{display:flex;flex-direction:column;gap:5px}
.layers i{display:block;height:9px;border-radius:999px;background:var(--surface-2)}
.layers i:nth-child(2){margin:0 0 0 4px}.layers i:nth-child(3){margin:0 2px 0 8px;background:var(--accent)}.layers i:nth-child(4){margin:0 9px 0 1px}

.bead:active{transform:scale(.97)}.bead.quiet{background:var(--surface-2);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.bead:hover{background:var(--accent-strong)}.bead.quiet:hover{background:#134C9F}.bar .back:hover{color:var(--ink)}}

.c{min-height:calc(100svh - 72px);display:grid;align-items:center;padding:0 var(--m) 72px;max-width:1520px;margin:0 auto}
.c{grid-template-columns:1fr;gap:48px}
@media (min-width:900px){.c{grid-template-columns:1fr 1fr}}
.c > div{display:grid;gap:28px;max-width:40rem}
.c h1{font-size:clamp(2.75rem,1.2rem + 5vw,5.5rem)}
.c p{margin:0;font-size:clamp(1.25rem,1.1rem + .7vw,1.625rem);line-height:1.35;max-width:30ch}
/* uma impressão que parou na metade: as camadas que faltam ficam vazias */
.half{min-width:0}
.half svg{width:100%;height:auto}
.half rect.on{transform-box:fill-box;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.half rect.on{animation:grow 600ms var(--ease-out) both}.c h1,.c p,.acts{animation:rise 700ms var(--ease-out) both}.c p{animation-delay:90ms}.acts{animation-delay:180ms}}
.acts{display:flex;gap:10px;flex-wrap:wrap}
