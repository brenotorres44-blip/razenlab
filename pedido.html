<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Seu pedido · RazenLab</title>
<meta name="theme-color" content="#080d15">
<link rel="icon" type="image/png" href="assets/favicon.png">



<style>
:root{
  --abyss:#020A1F; --navy:#051433; --panel:#0B1C40; --line:#1A3366;
  --electric:#1E9BFF; --cyan:#5CE1FF; --spark:#F28A14; --mint:#3FD9A4; --red:#FF5C74; --gold:#F2C14E;
  --text:#EEF4FF; --muted:#9DB0D3; --faint:#6A7FA8;
  --display:"Sora","Segoe UI",system-ui,sans-serif; --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--abyss);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(700px 420px at 80% -10%,rgba(30,155,255,.18),transparent 70%)}
.wrap{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.top img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px rgba(92,225,255,.35),0 0 18px rgba(30,155,255,.35)}
.top b{font-family:var(--display);font-size:18px;letter-spacing:.5px}
.top b span{color:var(--electric)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.5px}
h2{font-family:var(--display);font-size:18px;margin:0 0 12px}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

.passos{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:22px 0 4px;counter-reset:s}
.passo{position:relative;text-align:center;font-size:11.5px;color:var(--faint);padding-top:26px;line-height:1.3}
.passo::before{content:"";position:absolute;top:8px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--line);background:var(--abyss);z-index:1}
.passo::after{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line)}
.passo:first-child::after{display:none}
.passo.feito{color:var(--muted)} .passo.feito::before{background:var(--electric);border-color:var(--electric)} .passo.feito::after{background:var(--electric)}
.passo.agora{color:var(--text);font-weight:600} .passo.agora::before{border-color:var(--cyan);background:var(--cyan);box-shadow:0 0 12px var(--cyan)} .passo.agora::after{background:var(--electric)}

.aviso{border-radius:14px;padding:16px 18px;margin-top:18px;border:1px solid var(--line);background:rgba(30,155,255,.07)}
.aviso b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.aviso p{margin:0;color:var(--muted);font-size:15px}
.li{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.li:last-child{border-bottom:none}
.li span:first-child{color:var(--muted)}
.li.total{font-family:var(--display);font-size:20px;border-top:2px solid var(--line);border-bottom:none;padding-top:14px;margin-top:4px}
.li.total span:last-child{color:var(--cyan)}
.recado{background:rgba(92,225,255,.06);border-left:3px solid var(--cyan);border-radius:8px;padding:12px 14px;margin-top:14px;white-space:pre-line;font-size:15px}

.pix{display:grid;gap:18px}
@media(min-width:600px){.pix{grid-template-columns:auto 1fr;align-items:start}}
.qr{background:#fff;border-radius:14px;padding:12px;width:220px;height:220px;display:grid;place-items:center;justify-self:center}
.qr svg{display:block;width:196px;height:196px}
.cc{background:var(--abyss);border:1px dashed var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted);word-break:break-all;max-height:96px;overflow:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 22px;font-family:var(--body);font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;text-decoration:none;width:100%}
.btn-main{background:var(--electric);color:#fff;box-shadow:0 6px 22px rgba(30,155,255,.35)}
.btn-line{background:transparent;color:var(--text);border-color:var(--line)}
.btn-line:hover{border-color:var(--electric)}
.btn:disabled{opacity:.6;cursor:wait}
.row{display:grid;gap:10px}
@media(min-width:600px){.row.two{grid-template-columns:1fr 1fr}}
.arquivo{display:block;border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:var(--muted);font-size:15px}
.arquivo:hover{border-color:var(--electric);color:var(--text)}
.arquivo input{display:none}
.nota{font-size:13px;color:var(--faint);margin-top:8px}
.ok{color:var(--mint)} .erro{color:var(--red)}
.cod{font-family:var(--display);font-size:22px;letter-spacing:1px}
footer{text-align:center;color:var(--faint);font-size:13px;margin-top:26px}
.carregando{color:var(--muted);text-align:center;padding:60px 0}
@media(max-width:520px){.passo{font-size:10px}.card{padding:18px}}
</style>
<link rel="stylesheet" href="styles/paginas.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head>

  <div class="top"><img id="logo" alt=""><b>RAZEN<span>LAB</span></b></div>

<script>
/* Gerador de QR Code — Kazuhiko Arase, licença MIT (embutido para não depender de site externo) */
//---------------------------------------------------------------------

// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);

    orcamento: ["Seu orçamento está pronto", "Confira os valores abaixo. A produção começa assim que o Pix for confirmado."],
    comprovante: ["Recebemos seu comprovante", "Estamos conferindo o pagamento. Em breve seu pedido entra em produção."],
    pago: ["Pagamento confirmado!", "Seu pedido está na fila de impressão."],
    imprimindo: ["Sua peça está sendo impressa", "Camada por camada. Avisamos quando for postada."],
    pronto: ["Sua peça está pronta", "Estamos preparando o envio pelos Correios."],
    enviado: ["Seu pedido está a caminho", "Acompanhe a entrega pelo código de rastreio."],
    entregue: ["Pedido entregue", "Obrigado por escolher a RazenLab! Esperamos que tenha gostado."],
    cancelado: ["Pedido cancelado", "Se tiver alguma dúvida, fale com a gente pelo WhatsApp."]
  }[s] || ["Seu pedido", ""];
  return `<div class="aviso" style="border-color:${COR[s]}55;background:${COR[s]}12"><b>${m[0]}</b><p>${m[1]}</p></div>`;
}

function render(){
  const s = P.status, etapa = ETAPA[s] ?? 0;
  const temPreco = P.total != null;
  const e = P.endereco || {};
  const end = [e.rua && `${e.rua}${e.numero ? ", " + e.numero : ""}`, e.complemento, e.bairro, e.cidade && `${e.cidade}${e.uf ? "/" + e.uf : ""}`, P.cep && `CEP ${P.cep}`].filter(Boolean).join(" · ");
  const zap = linkWhats(`Olá! Sobre o meu pedido ${numPed(P.numero)} da RazenLab.`);

  let html = `
  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div><div class="sub">Pedido ${numPed(P.numero)} · ${dataBR(P.criado_em)}</div><h1>Olá, ${esc((P.cliente || "").split(" ")[0] || "cliente")}!</h1></div>
      <span class="pill" style="color:${COR[s]};border-color:${COR[s]}66">${"<i></i>"}${ROTULO[s] || s}</span>
    </div>
    ${s !== "cancelado" ? `<div class="passos">${ETAPAS.map((t,i) => `<div class="passo ${i < etapa ? "feito" : i === etapa ? "agora" : ""}">${t}</div>`).join("")}</div>` : ""}
    ${mensagem()}
  </div>`;

  if(temPreco){
    html += `
    <div class="card">
      <h2>Orçamento</h2>
      <div class="li"><span>Peça</span><span>${esc(P.peca || "Peça impressa em 3D")}</span></div>
      ${P.material ? `<div class="li"><span>Material</span><span>${esc(P.material)}</span></div>` : ""}
      <div class="li"><span>Quantidade</span><span>${num(P.qtd)}</span></div>
      <div class="li"><span>Valor por peça</span><span>${brl(P.precoUn)}</span></div>
      ${num(P.desconto) > 0 ? `<div class="li"><span>Desconto</span><span>− ${brl(P.desconto)}</span></div>` : ""}
      <div class="li"><span>Frete${P.freteServico ? ` <small style="display:block;font-size:12.5px;color:var(--faint)">${esc(P.freteServico)}</small>` : ""}</span><span>${num(P.frete) > 0 ? brl(P.frete) : "incluso"}</span></div>
      ${P.prazo ? `<div class="li"><span>Prazo de envio</span><span>${dataBR(P.prazo)}</span></div>` : ""}
      <div class="li total"><span>Total</span><span>${brl(P.total)}</span></div>
      ${P.recado ? `<div class="recado">${esc(P.recado)}</div>` : ""}
    </div>`;
  }else if(P.pedidoCliente){
    html += `<div class="card"><h2>O que você pediu</h2><p style="margin:0;white-space:pre-line;color:var(--muted)">${esc(P.pedidoCliente)}</p></div>`;
  }

  if(s === "orcamento" && P.pix && P.pix.chave){
    const valor = Math.round(num(P.total) * 100) / 100;
    const codigo = brCode(P.pix.chave, P.pix.nome, P.pix.cidade, valor, "RZL" + String(P.numero).padStart(6, "0"));
    html += `
    <div class="card" id="pagar">
      <h2>Pagar com Pix</h2>
      <div class="pix">
        <div class="qr" id="qr" aria-label="QR Code do Pix"></div>
        <div>
          <p class="sub" style="margin:0 0 10px">Abra o app do seu banco, escolha <b>Pix → Ler QR Code</b> ou <b>Pix Copia e Cola</b>. O valor de <b style="color:var(--text)">${brl(valor)}</b> já vem preenchido.</p>
          <div class="cc" id="cc">${esc(codigo)}</div>
          <button class="btn btn-main" style="margin-top:10px" id="copiar">Copiar código Pix</button>
          <p class="nota">Recebedor: ${esc(P.pix.nome || "RazenLab")} · Chave: ${esc(P.pix.chave)}</p>
        </div>
      </div>
    </div>`;
    setTimeout(() => {
      try{
        const q = qrcode(0, "M"); q.addData(codigo); q.make();
        document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize:4, margin:0, scalable:true, alt:"QR Code do Pix" });
      }
      catch(err){ document.getElementById("qr").innerHTML = `<span style="color:#333;font-size:13px;text-align:center;padding:10px">Use o código<br>copia e cola</span>`; }
      document.getElementById("copiar").onclick = async ev => {
        try{ await navigator.clipboard.writeText(codigo); ev.target.textContent = "Código copiado ✓"; }
        catch(err){ const r = document.createRange(); r.selectNodeContents(document.getElementById("cc")); getSelection().removeAllRanges(); getSelection().addRange(r); ev.target.textContent = "Selecionado — copie"; }
      };
    }, 0);
  }

  if(s === "orcamento" || s === "comprovante"){
    html += `
    <div class="card">
      <h2>${s === "comprovante" ? "Enviar outro comprovante" : "Já pagou? Envie o comprovante"}</h2>
      <label class="arquivo" id="caixa-arq"><input type="file" id="arq" accept="image/*,application/pdf"><span id="arq-nome">Toque para escolher a imagem ou o PDF do comprovante</span></label>
      <button class="btn btn-main" style="margin-top:12px" id="enviar" disabled>Enviar comprovante</button>
      <p class="nota" id="arq-msg">A produção começa depois que o pagamento for conferido.</p>
    </div>`;
  }

  if((s === "enviado" || s === "entregue") && P.rastreio){
    html += `
    <div class="card">
      <h2>Rastreio dos Correios</h2>
      <div class="cod">${esc(P.rastreio)}</div>
      <div class="row two" style="margin-top:14px">
        <button class="btn btn-line" id="copiar-rastreio">Copiar código</button>
        <a class="btn btn-main" href="https://rastreamento.correios.com.br/app/index.php" target="_blank" rel="noopener">Rastrear nos Correios</a>
      </div>
    </div>`;
  }

  if(end) html += `<div class="card"><h2>Entrega</h2><p style="margin:0;color:var(--muted)">${esc(end)}</p><p class="nota">Algo errado no endereço? Avise antes do envio pelo WhatsApp.</p></div>`;
  if(zap) html += `<a class="btn btn-line" href="${zap}" target="_blank" rel="noopener">Falar com a RazenLab no WhatsApp</a>`;
  raiz.innerHTML = html;
  ligarEventos();
}

function comprimir(arq){
  return new Promise((ok, erro) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image();
      img.onload = () => { const max = 1600; let w = img.width, h = img.height;
        if(w > max || h > max){ const k = max / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
        cv.toBlob(b => b ? ok(b) : erro(new Error("imagem")), "image/jpeg", .85); };
      img.onerror = () => erro(new Error("imagem")); img.src = r.result; };
    r.onerror = () => erro(r.error); r.readAsDataURL(arq);
  });
}
function ligarEventos(){
  const cr = document.getElementById("copiar-rastreio");
  if(cr) cr.onclick = async () => { try{ await navigator.clipboard.writeText(P.rastreio); cr.textContent = "Copiado ✓"; }catch(e){} };
  const arq = document.getElementById("arq"); if(!arq) return;
  const btn = document.getElementById("enviar"), msg = document.getElementById("arq-msg");
  arq.onchange = () => {
    const f = arq.files[0];
    document.getElementById("arq-nome").textContent = f ? f.name : "Toque para escolher a imagem ou o PDF do comprovante";
    btn.disabled = !f;
  };
  btn.onclick = async () => {
    const f = arq.files[0]; if(!f) return;
    btn.disabled = true; btn.textContent = "Enviando…"; msg.className = "nota"; msg.textContent = "";
    try{
      const pdf = f.type === "application/pdf";
      if(pdf && f.size > 10*1024*1024) throw new Error("O PDF passa de 10 MB.");
      const corpo = pdf ? f : await comprimir(f);
      const nome = `${crypto.randomUUID()}.${pdf ? "pdf" : "jpg"}`;
      const up = await sb.storage.from("comprovantes").upload(nome, corpo, { contentType: pdf ? "application/pdf" : "image/jpeg", upsert:false });
      if(up.error) throw up.error;
      const r = await sb.rpc("enviar_comprovante", { p_token: token, p_arquivo: "comprovantes/" + nome });
      if(r.error) throw r.error;
      sb.functions.invoke("avisar", { body:{ token, evento:"comprovante" } }).catch(() => {});
      await carregar();
      window.scrollTo({ top:0, behavior:"smooth" });
    }catch(e){
      msg.className = "nota erro"; msg.textContent = "Não foi possível enviar: " + (e.message || e) + " Tente de novo ou mande pelo WhatsApp.";
      btn.disabled = false; btn.textContent = "Enviar comprovante";
    }
  };
}

async function carregar(){
  const r = await sb.rpc("ver_pedido", { p_token: token });
  if(r.error) throw r.error;
  P = r.data;
  if(!P){ raiz.innerHTML = `<div class="card"><h1>Pedido não encontrado</h1><p class="sub">Confira se o link está completo. Se precisar, peça um novo link pelo WhatsApp.</p></div>`; return; }
  document.title = `Pedido ${numPed(P.numero)} · RazenLab`;
  render();
}

(async function(){
  if(!sb){ raiz.innerHTML = `<div class="card"><h1>Página em manutenção</h1><p class="sub">Tente de novo em alguns minutos.</p></div>`; return; }
  if(!/^[0-9a-f-]{36}$/i.test(token)){ raiz.innerHTML = `<div class="card"><h1>Link incompleto</h1><p class="sub">Abra o link exatamente como recebeu no WhatsApp.</p></div>`; return; }
  try{ await carregar(); }
  catch(e){ raiz.innerHTML = `<div class="card"><h1>Não conseguimos carregar</h1><p class="sub">Verifique sua internet e recarregue a página.</p></div>`; }
})();
</script>

</html>
