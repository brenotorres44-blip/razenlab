<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Painel RazenLab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030C2B">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bed:#020A1F; --panel:#0B1C40; --raised:#12295A; --line:#1A3366;
  --electric:#1E9BFF; --cyan:#5CE1FF; --spark:#F28A14; --mint:#3FD9A4;
  --text:#EEF4FF; --muted:#9DB0D3; --faint:#6A7FA8; --rose:#E0808A; --violet:#9B8BFF;
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bed);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
h2{font-family:var(--display);font-size:18px;margin:0 0 14px;font-weight:600;letter-spacing:-.2px}
h3{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--muted)}
p{margin:0 0 10px}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:20;background:rgba(2,10,31,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.head-in{max-width:1120px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 1px rgba(92,225,255,.35),0 0 14px rgba(30,155,255,.3)}
.brand b{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.4px}
.brand b span{color:var(--electric)}
.brand .tagp{font-size:12px;color:var(--faint);margin-left:4px}
.brand a{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.brand a:hover{border-color:var(--electric);color:var(--text)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:none;color:var(--muted);font-size:14px;font-family:var(--body);font-weight:500;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--electric)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;gap:12px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.split{display:grid;grid-template-columns:3fr 2fr;gap:14px;align-items:start}}

label{display:block}
label>span.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.hint{display:block;font-size:12px;color:var(--faint);margin-top:4px}
input,select,textarea{width:100%;background:var(--bed);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:15px;font-family:var(--body);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--electric)}
input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.field-row{display:flex;align-items:center;gap:8px;background:var(--bed);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.field-row:focus-within{border-color:var(--electric)}
.field-row input{border:none;background:none;padding:10px 0}
.field-row .unit{color:var(--muted);font-size:13px;white-space:nowrap}
textarea{resize:vertical;min-height:72px}
.check{display:flex;align-items:center;gap:10px;cursor:pointer}
.check input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--electric)}

button.btn{background:var(--raised);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;font-size:14px;font-family:var(--body);font-weight:500;cursor:pointer}
button.btn:hover{border-color:var(--muted)}
button.primary{background:var(--electric);border-color:var(--electric);color:#fff;font-weight:600}
button.primary:hover{border-color:var(--cyan)}
button.danger{color:var(--rose)}
button.link{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 0;font-family:var(--body);text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{margin-left:auto}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.5px;margin-top:4px}
.kpi .l{font-size:13px;color:var(--muted)}
.big{font-family:var(--display);font-size:38px;font-weight:700;color:var(--cyan);letter-spacing:-1px;line-height:1.1}
.line-item{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.line-item span:first-child{color:var(--muted)}
.divider{border-top:1px solid var(--line);margin:14px 0}
.bar-wrap{margin-bottom:12px}
.bar{height:4px;border-radius:2px;margin-bottom:2px}

.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .grow{flex:1;min-width:0}
.item .name{font-size:15px;font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .num-ped{font-family:var(--mono);font-size:12px;color:var(--faint);margin-right:6px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--raised);flex:0 0 auto}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:26px 10px}

.overlay{position:fixed;inset:0;background:rgba(1,6,18,.82);z-index:50;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
@media(min-width:700px){.overlay{align-items:flex-start;padding:36px 16px}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:740px;padding:20px;margin-top:40px}
@media(min-width:700px){.modal{border-radius:18px;margin-top:0}}
.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-head h2{margin:0;flex:1}
.close{background:none;border:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer;padding:0 4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--raised);border:1px solid var(--line);color:var(--text);padding:12px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:90vw}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:var(--body)}
.chip.on{background:var(--electric);color:#fff;border-color:var(--electric)}
.fotos{display:flex;gap:10px;flex-wrap:wrap}
.foto{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(2,10,31,.85);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.foto-add{width:96px;height:96px;border-radius:12px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:pointer;text-align:center;background:none;font-family:var(--body)}
.foto-add:hover{border-color:var(--electric);color:var(--text)}
.steps-pub{counter-reset:p;margin:0;padding:0;list-style:none}
.steps-pub li{counter-increment:p;padding:8px 0 8px 34px;position:relative;font-size:14px;color:var(--muted)}
.steps-pub li::before{content:counter(p);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;background:var(--raised);color:var(--cyan);font-size:12px;font-weight:600;display:grid;place-items:center}
.steps-pub b{color:var(--text);font-weight:600}
</style>
</head>

<script>
"use strict";

/* ============================================================
   1. DADOS
   Pedidos, filamentos e configurações → localStorage.
   Vitrine (tem fotos, pesa mais) → IndexedDB.
   ============================================================ */
const CHAVE = "razenlab.v1";
const CHAVE_ANTIGA = "atelie3d.v1";

const CONFIG_PADRAO = {
  precoFilamento: 120,   // R$/kg — usado quando o pedido não aponta para um filamento do catálogo
  potencia: 200,         // W médios durante a impressão
  precoKwh: 0.92,        // R$/kWh com impostos
  valorImpressora: 2000, // R$
  vidaUtil: 5000,        // horas de vida estimada
  manutencaoHora: 0.5,   // R$/h em bicos, correias, plataforma
  horaTrabalho: 30,      // R$/h do seu tempo
  taxaFalha: 8,          // % do custo guardado para impressões perdidas
  margem: 60,            // % de lucro sobre o custo
  taxaPagamento: 5       // % da maquininha ou marketplace
};

const NEGOCIO_PADRAO = {
  nome: "RazenLab",
  slogan: "Peças personalizadas, presentes, protótipos e reposições. Você manda a ideia ou o arquivo, eu cuido do resto.",
  sobre: "Preencha o que souber. A mensagem vai pronta para o WhatsApp e eu respondo com o orçamento.",
  whatsapp: "", instagram: "", email: "", cidade: "", responsavel: "",
  pagamento: "Pix, dinheiro ou cartão. 50% na aprovação e 50% na entrega.",
  validadeDias: 7,
  entregas: ""
};

const STATUS = {
  orcamento: { rotulo:"Orçamento", cor:"#9DB0D3" },
  aprovado:  { rotulo:"Aprovado",  cor:"#1E9BFF" },
  imprimindo:{ rotulo:"Imprimindo",cor:"#F28A14" },
  pronto:    { rotulo:"Pronto",    cor:"#9B8BFF" },
  entregue:  { rotulo:"Entregue",  cor:"#3FD9A4" },
  cancelado: { rotulo:"Cancelado", cor:"#E0808A" }
};

let dados = { config:{...CONFIG_PADRAO}, negocio:{...NEGOCIO_PADRAO}, filamentos:[], pedidos:[], seq:0 };
let vitrine = [];
let aba = "painel";
let filtroStatus = "abertos";
let busca = "";

function normalizar(d){
  return {
    config: {...CONFIG_PADRAO, ...(d.config||{})},
    negocio: {...NEGOCIO_PADRAO, ...(d.negocio||{})},
    filamentos: d.filamentos || [],
    pedidos: d.pedidos || [],
    seq: d.seq || (d.pedidos||[]).reduce((m,p)=>Math.max(m, p.numero||0), 0)
  };
}
function carregar(){
  try{
    let bruto = localStorage.getItem(CHAVE);
    if(!bruto){
      // traz os dados da versão anterior (Ateliê 3D), se existirem
      bruto = localStorage.getItem(CHAVE_ANTIGA);
      if(bruto) setTimeout(()=>toast("Pedidos da versão anterior importados."), 400);
    }
    if(bruto) dados = normalizar(JSON.parse(bruto));
    // numera pedidos antigos que ainda não têm número
    dados.pedidos.slice().reverse().forEach(p => { if(!p.numero) p.numero = ++dados.seq; });
  }catch(e){
    toast("Não foi possível ler os dados salvos.");
  }
}
function salvar(){
  try{ localStorage.setItem(CHAVE, JSON.stringify(dados)); }
  catch(e){ toast("O navegador recusou a gravação. Exporte um backup."); }
}

/* IndexedDB mínimo, só para a vitrine */
const idb = {
  db: null,
  abrir(){
    return new Promise((ok, erro) => {
      if(this.db) return ok(this.db);
      const r = indexedDB.open("razenlab", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { this.db = r.result; ok(this.db); };
      r.onerror = () => erro(r.error);
    });
  },
  async get(k){
    const db = await this.abrir();
    return new Promise((ok, erro) => {
      const r = db.transaction("kv").objectStore("kv").get(k);
      r.onsuccess = () => ok(r.result); r.onerror = () => erro(r.error);
    });
  },
  async set(k, v){
    const db = await this.abrir();
    return new Promise((ok, erro) => {
      const t = db.transaction("kv", "readwrite");
      t.objectStore("kv").put(v, k);
      t.oncomplete = () => ok(); t.onerror = () => erro(t.error);
    });
  }
};

/* ============================================================
   2. FORMATAÇÃO E APOIO
   ============================================================ */
function num(v){
  if(typeof v === "number") return isFinite(v) ? v : 0;
  if(v == null) return 0;
  let s = String(v).trim().replace(/\s|R\$/g,"");
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,"");
  s = s.replace(",",".");
  const x = parseFloat(s);
  return isFinite(x) ? x : 0;
}
const brl = v => (isFinite(v)?v:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dec = (v,c=1) => (isFinite(v)?v:0).toLocaleString("pt-BR",{minimumFractionDigits:c,maximumFractionDigits:c});
function dataBR(iso){
  if(!iso) return "—";
  const [a,m,d] = iso.slice(0,10).split("-");
  return d && m && a ? `${d}/${m}/${a}` : iso;
}
function hoje(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const id = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const numPed = n => "#" + String(n||0).padStart(4,"0");

let toastTimer;
function toast(msg){
  clearTimeout(toastTimer);
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(()=>el.remove(), 3200);
}

/* ============================================================
   3. CÁLCULO DE PREÇO
   Todas as fórmulas do sistema estão aqui.
   ============================================================ */
function precificar(p, cfg = dados.config){
  const horas = num(p.horas) + num(p.minutos)/60;
  const qtd = Math.max(1, Math.round(num(p.qtd)) || 1);

  // preço do filamento: o do catálogo, se o pedido apontar para um
  const fil = dados.filamentos.find(f => f.id === p.filamentoId);
  const precoKg = fil ? num(fil.precoKg) : num(cfg.precoFilamento);

  // custos diretos de uma peça
  const material  = (num(p.peso)/1000) * precoKg;
  const energia   = (num(cfg.potencia)/1000) * horas * num(cfg.precoKwh);
  const depreciacao = num(cfg.vidaUtil) > 0 ? (num(cfg.valorImpressora)/num(cfg.vidaUtil)) * horas : 0;
  const maquina   = depreciacao + num(cfg.manutencaoHora) * horas;
  const trabalho  = (num(p.acabamento)/60) * num(cfg.horaTrabalho);
  const extras    = num(p.extras);

  // custo de produção: só o que depende da impressora e do seu tempo
  const direto = material + energia + maquina + trabalho;

  // reserva para o que der errado e precisar ser reimpresso
  const falha = direto * (num(cfg.taxaFalha)/100);

  // margem só sobre a produção
  const comMargem = (direto + falha) * (1 + num(cfg.margem)/100);

  // a taxa de recebimento é somada por fora, para não comer a margem
  const t = Math.min(Math.max(num(cfg.taxaPagamento),0), 90)/100;

  // extras (tinta, ímã, caixinha) entram pelo valor pago, sem margem nem reserva
  const custo = direto + falha + extras;
  let preco = comMargem / (1 - t) + extras;

  // preço combinado manualmente substitui o calculado
  const manual = num(p.precoManual);
  if(manual > 0) preco = manual;

  // arredonda para centavos, para o orçamento fechar na conta do cliente
  preco = Math.round(preco*100)/100;

  const taxa  = preco * t;
  const lucro = preco - taxa - custo;

  // o frete entra no total e no custo, então não altera o lucro
  const entrega = num(p.entrega);
  const desconto = Math.max(0, num(p.desconto));
  const total = Math.max(0, preco*qtd - desconto) + entrega;

  return {
    horas, qtd, precoKg, fil,
    material, energia, maquina, trabalho, extras, falha,
    custo, taxa, lucro, preco, manual: manual > 0,
    entrega, desconto, total,
    custoTotal: custo*qtd + entrega,
    lucroTotal: lucro*qtd - desconto,
    horasTotal: horas*qtd,
    filamentoTotal: num(p.peso)*qtd,
    margemReal: preco > 0 ? ((lucro*qtd - desconto)/(preco*qtd))*100 : 0
  };
}

}
function fecharModal(){

}

function atualizarModalPedido(){
  const form = document.getElementById("ped-form");
  const res = document.getElementById("ped-res");
  if(!form || !res) return;
  res.innerHTML = blocoResultado(precificar(lerCampos(form)));
}

function montarPedido(){
  const v = lerCampos(document.getElementById("ped-form"));
  const c = precificar(v);
  const p = {
    ...pedidoAberto,
    peca:v.peca.trim(), cliente:v.cliente.trim(), contato:v.contato.trim(), obs:v.obs,
    status:v.status, prazo:v.prazo, filamentoId:v.filamentoId,
    qtd:c.qtd, peso:num(v.peso), horas:num(v.horas), minutos:num(v.minutos),
    acabamento:num(v.acabamento), extras:num(v.extras), entrega:num(v.entrega),
    precoManual: num(v.precoManual) > 0 ? num(v.precoManual) : "",
    desconto:num(v.desconto), valorPago:num(v.valorPago),
    precoUn:c.preco, total:c.total, custoTotal:c.custoTotal, lucroTotal:c.lucroTotal,
    horasTotal:c.horasTotal, filamentoTotal:c.filamentoTotal
  };
  if(p.status === "entregue" && !p.dataEntregue) p.dataEntregue = hoje();
  if(p.status !== "entregue") delete p.dataEntregue;
  return p;
}
function salvarPedido(silencioso){
  const p = montarPedido();
  if(p.id){
    dados.pedidos = dados.pedidos.map(x => x.id===p.id ? p : x);
  }else{
    p.id = id();
    p.numero = ++dados.seq;
    p.criadoEm = new Date().toISOString();
    dados.pedidos.unshift(p);
  }
  salvar();
  pedidoAberto = p;
  if(!silencioso){ fecharModal(); render(); toast(`Pedido ${numPed(p.numero)} salvo.`); }
  return p;
}

function textoResumo(p){
  const c = precificar(p);
  const n = dados.negocio;
  return [
    `*Orçamento ${n.nome || "RazenLab"} ${numPed(p.numero)}*`,
    "",
    `${p.peca || "Peça"} — ${c.qtd} un.`,
    `Valor por peça: ${brl(c.preco)}`,
    c.desconto > 0 ? `Desconto: − ${brl(c.desconto)}` : null,
    c.entrega > 0 ? `Entrega: ${brl(c.entrega)}` : null,
    `*Total: ${brl(c.total)}*`,
    p.prazo ? `Prazo: ${dataBR(p.prazo)}` : null,
    c.fil ? `Material: ${[c.fil.material, c.fil.cor].filter(Boolean).join(" ")}` : null,
    "",
    n.pagamento ? `Pagamento: ${n.pagamento}` : null,
    `Válido por ${num(n.validadeDias)||7} dias.`
  ].filter(x => x !== null).join("\n");
}
function enviarWhats(){
  const p = salvarPedido(true);
  const txt = textoResumo(p);
  let fone = String(p.contato||"").replace(/\D/g,"");
  if(fone.length >= 10 && fone.length <= 11) fone = "55" + fone;
  const url = fone.length >= 12
    ? `https://wa.me/${fone}?text=${encodeURIComponent(txt)}`
    : `https://wa.me/?text=${encodeURIComponent(txt)}`;
  window.open(url, "_blank", "noopener");
  desenharModalPedido();
}

function guardarCamposTrabalho(){

  Object.assign(trabalhoAberto, {

    prazo:v.prazo, descricao:v.descricao, visivel:v.visivel, destaque:v.destaque
  });
}
async function salvarTrabalho(){
  guardarCamposTrabalho();
  const t = trabalhoAberto;
  if(!t.titulo.trim()){ toast("Dê um título ao trabalho."); return; }
  if(!t.fotos.length){ toast("Adicione pelo menos uma foto."); return; }
  t.titulo = t.titulo.trim(); t.categoria = t.categoria.trim();
  if(t.id) vitrine = vitrine.map(v => v.id===t.id ? t : v);
  else { t.id = id(); t.criadoEm = new Date().toISOString(); vitrine.unshift(t); }
  await salvarVitrine();
  fecharModal(); aba = "vitrine"; render();
  toast("Trabalho salvo. Baixe a vitrine.json para publicar.");
}

/* reduz a foto para caber no site sem pesar */
function comprimirFoto(arquivo){
  return new Promise((ok, erro) => {
    const leitor = new FileReader();
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1100;
        let w = img.width, h = img.height;
        if(w > max || h > max){ const k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
        const cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        ok(cv.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = () => erro(new Error("imagem"));
      img.src = leitor.result;
    };
    leitor.onerror = () => erro(leitor.error);
    leitor.readAsDataURL(arquivo);
  });
}

function baixarArquivo(nome, conteudo){
  const blob = new Blob([conteudo], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}
function publicarVitrine(){
  const n = dados.negocio;
  const pacote = {
    negocio: { nome:n.nome, slogan:n.slogan, sobre:n.sobre, whatsapp:n.whatsapp, instagram:n.instagram, email:n.email, cidade:n.cidade, entregas:n.entregas },
    itens: vitrine.filter(v => v.visivel !== false).map(v => ({
      id:v.id, titulo:v.titulo, categoria:v.categoria, descricao:v.descricao, material:v.material,
      dimensoes:v.dimensoes, prazo:v.prazo, fotos:v.fotos, destaque:!!v.destaque
    })),
    atualizadoEm: new Date().toISOString()
  };
  baixarArquivo("vitrine.json", JSON.stringify(pacote));
  toast(`vitrine.json com ${pacote.itens.length} trabalho${pacote.itens.length===1?"":"s"}. Agora suba no GitHub.`);
}
async function carregarVitrineDoSite(){
  try{
    const r = await fetch("vitrine.json?v=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error();
    const d = await r.json();
    const chegando = (d.itens||[]).map(i => ({...i, visivel:true}));
    const ids = new Set(vitrine.map(v=>v.id));
    const novos = chegando.filter(i => !ids.has(i.id));
    vitrine = [...vitrine, ...novos];
    if(d.negocio){
      Object.keys(d.negocio).forEach(k => { if(d.negocio[k] && !dados.negocio[k]) dados.negocio[k] = d.negocio[k]; });
      salvar();
    }
    await salvarVitrine(); render();
    toast(novos.length ? `${novos.length} trabalho${novos.length===1?"":"s"} trazido${novos.length===1?"":"s"} do site.` : "Nada novo no site.");
  }catch(e){
    toast("Não encontrei a vitrine.json publicada. O painel precisa estar aberto pelo endereço do site.");
  }
}

/* ============================================================
   7. BACKUP
   ============================================================ */
function exportar(){
  baixarArquivo(`razenlab-backup-${hoje()}.json`, JSON.stringify({...dados, vitrine, versao:1}, null, 1));
  toast("Backup gerado.");
}
function importar(arquivo){
  const leitor = new FileReader();
  leitor.onload = async () => {
    try{
      const d = JSON.parse(leitor.result);
      if(!d || typeof d !== "object" || !Array.isArray(d.pedidos)) throw new Error("formato");
      dados = normalizar(d);
      if(Array.isArray(d.vitrine)){ vitrine = d.vitrine; await salvarVitrine(); }
      salvar(); render();
      toast(`${dados.pedidos.length} pedidos e ${vitrine.length} trabalhos carregados.`);
    }catch(e){ toast("Esse arquivo não é um backup do painel."); }
  };
  leitor.onerror = () => toast("Não foi possível ler o arquivo.");
  leitor.readAsText(arquivo);
}

/* ============================================================
   8. EVENTOS
   ============================================================ */
document.addEventListener("click", async e => {
  const alvo = e.target;

  const tab = alvo.closest("#nav button");
  if(tab){ aba = tab.dataset.tab; render(); window.scrollTo(0,0); return; }

  if(alvo.hasAttribute("data-fechar")){ fecharModal(); return; }

  const chip = alvo.closest("[data-filtro]");
  if(chip){ filtroStatus = chip.dataset.filtro; render(); return; }

  const abrir = alvo.closest("[data-abrir]");
  if(abrir){ abrirPedido(dados.pedidos.find(p => p.id === abrir.dataset.abrir)); return; }

  const trab = alvo.closest("[data-trabalho]");
  if(trab){ abrirTrabalho(vitrine.find(v => v.id === trab.dataset.trabalho)); return; }

  const delFoto = alvo.closest("[data-del-foto]");
  if(delFoto){ guardarCamposTrabalho(); trabalhoAberto.fotos.splice(+delFoto.dataset.delFoto, 1); desenharModalTrabalho(); return; }

  const delFil = alvo.closest("[data-del-filamento]");
  if(delFil){
    if(confirm("Remover este filamento do catálogo? Pedidos antigos passam a usar o preço padrão.")){
      dados.filamentos = dados.filamentos.filter(f => f.id !== delFil.dataset.delFilamento);
      salvar(); render();
    }
    return;
  }

  const acao = alvo.closest("[data-acao]");
  if(!acao) return;

  switch(acao.dataset.acao){
    case "novo": abrirPedido(null); break;

    case "simular-para-pedido": {
      const v = lerCampos(document.getElementById("sim-form"));
      abrirPedido({ id:null, peca:v.peca, cliente:"", contato:"", qtd:num(v.qtd)||1,
        peso:num(v.peso), horas:num(v.horas), minutos:num(v.minutos), acabamento:num(v.acabamento),
        extras:num(v.extras), entrega:num(v.entrega), filamentoId:v.filamentoId,
        status:"orcamento", prazo:"", obs:"", valorPago:0, precoManual:"", desconto:0 });
      break;
    }
    case "salvar-pedido": salvarPedido(false); break;
    case "gerar-orcamento": gerarOrcamento(); break;
    case "enviar-whats": enviarWhats(); break;
    case "pago-total": {
      const form = document.getElementById("ped-form");
      form.querySelector('[name="valorPago"]').value = dec(precificar(lerCampos(form)).total, 2);
      break;
    }
    case "duplicar": {
      const copia = {...montarPedido(), id:null, numero:null, status:"orcamento", valorPago:0, prazo:""};
      delete copia.dataEntregue; delete copia.criadoEm;
      abrirPedido(copia);
      toast("Cópia aberta. Ajuste e salve.");
      break;
    }
    case "para-vitrine": {
      const p = salvarPedido(true);
      const fil = dados.filamentos.find(f => f.id === p.filamentoId);
      abrirTrabalho(null);
      Object.assign(trabalhoAberto, { titulo:p.peca, material: fil ? [fil.material, fil.cor].filter(Boolean).join(" ") : "" });
      desenharModalTrabalho();
      render();
      toast("Adicione as fotos da peça.");
      break;
    }
    case "excluir-pedido":
      if(confirm("Excluir este pedido? Não dá para desfazer.")){
        dados.pedidos = dados.pedidos.filter(p => p.id !== pedidoAberto.id);
        salvar(); fecharModal(); render(); toast("Pedido excluído.");
      }
      break;

    case "novo-trabalho": abrirTrabalho(null); break;
    case "add-foto": guardarCamposTrabalho(); document.getElementById("arquivo-fotos").click(); break;
    case "salvar-trabalho": salvarTrabalho(); break;
    case "excluir-trabalho":
      if(confirm("Excluir este trabalho da vitrine?")){
        vitrine = vitrine.filter(v => v.id !== trabalhoAberto.id);
        await salvarVitrine(); fecharModal(); render(); toast("Trabalho excluído.");
      }
      break;
    case "publicar-vitrine": publicarVitrine(); break;
    case "carregar-vitrine-site": carregarVitrineDoSite(); break;

    case "add-filamento": {
      const f = lerCampos(document.getElementById("fil-form"));
      if(!f.nome.trim()){ toast("Dê um nome ao filamento."); break; }
      dados.filamentos.push({ id:id(), nome:f.nome.trim(), material:f.material.trim(), cor:f.cor.trim(), precoKg:num(f.precoKg) });
      salvar(); render(); toast("Filamento adicionado.");
      break;
    }
    case "salvar-negocio": {
      const n = lerCampos(document.getElementById("neg-form"));
      Object.keys(n).forEach(k => { dados.negocio[k] = k === "validadeDias" ? num(n[k]) : n[k].trim(); });
      salvar(); toast("Dados do negócio salvos. Publique a vitrine para atualizar o site.");
      break;
    }
    case "salvar-config": {
      const c = lerCampos(document.getElementById("cfg-form"));
      Object.keys(CONFIG_PADRAO).forEach(k => { dados.config[k] = num(c[k]); });
      salvar(); toast("Custos salvos.");
      break;
    }
    case "exportar": exportar(); break;
    case "importar": document.getElementById("arquivo-backup").click(); break;
    case "apagar":
      if(confirm("Apagar pedidos, vitrine, filamentos e configurações deste navegador?") &&
         confirm("Tem certeza? Sem um backup exportado, isso não volta.")){
        localStorage.removeItem(CHAVE); localStorage.removeItem(CHAVE_ANTIGA);
        dados = normalizar({}); vitrine = []; await salvarVitrine();
        render(); toast("Tudo apagado.");
      }
      break;
  }
});

document.addEventListener("input", e => {
  if(e.target.id === "busca"){
    busca = e.target.value;
    const tmp = document.createElement("div");
    tmp.innerHTML = viewPedidos();
    document.getElementById("lista-pedidos").innerHTML = tmp.querySelector("#lista-pedidos").innerHTML;
    return;
  }
  if(e.target.closest("#ped-form")) atualizarModalPedido();
  if(e.target.closest("#sim-form")) atualizarSimulador();
});
document.addEventListener("change", async e => {
  if(e.target.closest("#ped-form") || e.target.closest("#sim-form")){
    if(e.target.closest("#ped-form")) atualizarModalPedido(); else atualizarSimulador();
  }
  if(e.target.id === "arquivo-backup" && e.target.files[0]){ importar(e.target.files[0]); e.target.value = ""; }
  if(e.target.id === "arquivo-fotos" && e.target.files.length && trabalhoAberto){
    const livres = 4 - trabalhoAberto.fotos.length;
    const arquivos = [...e.target.files].slice(0, livres);
    toast("Preparando fotos…");
    for(const a of arquivos){
      try{ trabalhoAberto.fotos.push(await comprimirFoto(a)); }
      catch(err){ toast("Uma das imagens não pôde ser lida."); }
    }
    e.target.value = "";
    desenharModalTrabalho();
  }
});
document.addEventListener("keydown", e => { if(e.key === "Escape") fecharModal(); });

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

(async function iniciar(){
  carregar();
  await carregarVitrine();
  render();
})();
