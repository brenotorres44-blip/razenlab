<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RazenLab · Painel de Controle</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#02060F">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#02060F; --deep:#040C1C; --glass:rgba(8,26,54,.52); --glass2:rgba(12,36,72,.6);
  --line:rgba(92,225,255,.16); --line2:rgba(92,225,255,.32);
  --cyan:#3FE0FF; --blue:#1E9BFF; --spark:#F28A14; --mint:#3FD9A4; --red:#FF3B5C; --violet:#9B8BFF;
  --text:#E6F4FF; --muted:#8FA8C8; --faint:#56708F;
  --hud:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
  --side:232px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--void);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
.num,.hudn{font-family:var(--hud);font-variant-numeric:tabular-nums;letter-spacing:.3px}

/* ---------- fundo: grade, vinheta, partículas ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(900px 600px at 62% -8%,rgba(30,155,255,.16),transparent 62%),
    radial-gradient(700px 500px at 0% 100%,rgba(63,224,255,.06),transparent 60%),
    radial-gradient(500px 400px at 100% 80%,rgba(242,138,20,.04),transparent 60%)}
.bg::after{content:"";position:absolute;inset:-1px;
  background-image:linear-gradient(rgba(92,225,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(92,225,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 55% 30%,#000 30%,transparent 85%);mask-image:radial-gradient(ellipse at 55% 30%,#000 30%,transparent 85%)}
.pt{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);opacity:0;animation:flutua linear infinite;will-change:transform,opacity}
@keyframes flutua{0%{transform:translateY(0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-220px);opacity:0}}

/* ---------- inicialização ---------- */
.boot{position:fixed;inset:0;z-index:200;background:var(--void);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
.boot.fim{opacity:0;visibility:hidden}
.boot-in{display:grid;justify-items:center;gap:18px;width:min(360px,80vw)}
.boot-logo{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 40px rgba(30,155,255,.35);animation:bootpulse 1.4s ease-in-out infinite}
@keyframes bootpulse{50%{box-shadow:0 0 0 1px var(--cyan),0 0 60px rgba(63,224,255,.5)}}
.boot-t{font-family:var(--hud);font-weight:700;letter-spacing:6px;font-size:18px}
.boot-t span{color:var(--blue)}
.boot-bar{width:100%;height:2px;background:rgba(92,225,255,.12);overflow:hidden;border-radius:2px}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 12px var(--cyan);transition:width .9s cubic-bezier(.3,.7,.2,1)}
.boot-log{font-family:var(--hud);font-size:11px;letter-spacing:1.5px;color:var(--faint);height:16px}

/* entrada escalonada dos painéis */
.rv{opacity:0;transform:translateY(10px) scale(.992);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.pronto .rv{opacity:1;transform:none}

/* ---------- estrutura ---------- */
.app{position:relative;z-index:1;min-height:100%;padding-left:var(--side)}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--side);z-index:30;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,rgba(4,14,32,.92),rgba(2,8,20,.92));border-right:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.side::after{content:"";position:absolute;top:0;right:-1px;width:1px;height:140px;background:linear-gradient(var(--cyan),transparent);opacity:.7}
.marca{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none;color:inherit}
.marca img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 18px rgba(30,155,255,.35)}
.marca b{font-family:var(--hud);font-weight:700;font-size:17px;letter-spacing:2.5px;display:block;line-height:1.1}
.marca b span{color:var(--blue)}
.marca small{font-family:var(--hud);font-size:10px;letter-spacing:2px;color:var(--faint)}
.nav-it{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);font-size:14px;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:color .2s,background .25s,border-color .25s,box-shadow .25s}
.nav-it svg{width:18px;height:18px;flex:0 0 auto;transition:transform .25s,filter .25s}
.nav-it:hover{color:var(--text);background:rgba(30,155,255,.06);border-color:var(--line)}
.nav-it:hover svg{transform:scale(1.08);filter:drop-shadow(0 0 4px var(--cyan))}
.nav-it.on{color:var(--text);background:linear-gradient(90deg,rgba(30,155,255,.16),rgba(30,155,255,.02));border-color:var(--line2);box-shadow:inset 0 0 18px rgba(30,155,255,.08)}
.nav-it.on::before{content:"";position:absolute;left:-15px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.nav-it.on svg{color:var(--cyan)}
.nav-it .qt{margin-left:auto;font-family:var(--hud);font-size:11px;color:var(--cyan);background:rgba(63,224,255,.1);border:1px solid var(--line);border-radius:20px;padding:0 7px}
.side-foot{margin-top:auto;display:grid;gap:6px;padding:12px 8px 0;border-top:1px solid var(--line)}
.sys{display:flex;align-items:center;gap:8px;font-family:var(--hud);font-size:10.5px;letter-spacing:1.4px;color:var(--faint)}
.sys b{font-weight:500;color:var(--muted)}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:calc(16px + env(safe-area-inset-top,0px)) 28px 16px;
  background:linear-gradient(180deg,rgba(2,6,15,.94),rgba(2,6,15,.72));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-family:var(--hud);font-size:20px;font-weight:700;letter-spacing:4px;line-height:1.1}
.top h1 span{color:var(--blue)}
.top .sub{font-family:var(--hud);font-size:11px;letter-spacing:3px;color:var(--faint)}
.top-dir{margin-left:auto;display:flex;align-items:center;gap:22px}
.relogio{text-align:right}
.relogio .h{font-family:var(--hud);font-size:22px;font-weight:600;letter-spacing:2px;line-height:1}
.relogio .d{font-family:var(--hud);font-size:10.5px;letter-spacing:1.8px;color:var(--faint);margin-top:4px;text-transform:uppercase}
.online{display:flex;align-items:center;gap:8px;font-family:var(--hud);font-size:11px;letter-spacing:2px;color:var(--mint);border:1px solid rgba(63,217,164,.3);background:rgba(63,217,164,.06);border-radius:20px;padding:6px 12px}
.led{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;flex:0 0 auto}
.led.pulsa{animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

main.pg{padding:24px 28px 60px;max-width:1500px}
.pg-in{animation:entraPg .38s cubic-bezier(.2,.8,.2,1)}
@keyframes entraPg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- painel holográfico ---------- */
.pn{position:relative;background:linear-gradient(180deg,var(--glass2),var(--glass));border:1px solid var(--line);border-radius:14px;padding:18px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .3s,box-shadow .3s,transform .3s}
.pn::before,.pn::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--cyan);opacity:.55;pointer-events:none;transition:opacity .3s}
.pn::before{top:-1px;left:-1px;border-right:none;border-bottom:none;border-top-left-radius:14px}
.pn::after{bottom:-1px;right:-1px;border-left:none;border-top:none;border-bottom-right-radius:14px}
.pn.hov:hover{border-color:var(--line2);box-shadow:0 0 0 1px rgba(63,224,255,.08),0 18px 40px -18px rgba(30,155,255,.45);transform:translateY(-2px)}
.pn.hov:hover::before,.pn.hov:hover::after{opacity:1}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ph h2{margin:0;font-family:var(--hud);font-size:13px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase}
.ph h2::before{content:"▸ ";color:var(--cyan)}
.ph h2{min-width:0}
.ph .cod{white-space:nowrap;margin-left:auto;font-family:var(--hud);font-size:10px;letter-spacing:1.6px;color:var(--faint)}
.lbl{font-family:var(--hud);font-size:11px;letter-spacing:1.8px;color:var(--faint);text-transform:uppercase}

/* ---------- dashboard ---------- */
.kpis{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.kpi .v{font-family:var(--hud);font-size:30px;font-weight:600;letter-spacing:.5px;line-height:1.1;margin:8px 0 4px;white-space:nowrap}
.kpi .dl{font-size:12.5px;color:var(--muted);padding-right:96px}
@media(max-width:760px){.kpi .dl{padding-right:0}}
.up{color:var(--mint)} .dn{color:var(--red)}
.kpi svg.spark{position:absolute;right:14px;bottom:14px;width:96px;height:34px;opacity:.9}
.meio{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);margin-bottom:16px}
.baixo{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}

/* núcleo holográfico */
.nucleo{display:grid;place-items:center;min-height:430px;overflow:hidden}
.core{position:relative;width:min(380px,100%);aspect-ratio:1}
.core svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gira{transform-origin:200px 200px;transform-box:view-box;animation:gira linear infinite;will-change:transform}
@keyframes gira{to{transform:rotate(360deg)}}
.core .logo{position:absolute;left:27%;top:27%;width:46%;height:46%;border-radius:50%;overflow:hidden;box-shadow:0 0 50px rgba(30,155,255,.45)}
.core .logo img{width:100%;height:100%;object-fit:cover;display:block}
.core .logo::after{content:"";position:absolute;left:0;right:0;height:28%;top:-30%;background:linear-gradient(180deg,transparent,rgba(63,224,255,.28),transparent);animation:scan 3.6s ease-in-out infinite;will-change:transform}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(470%)}100%{transform:translateY(0)}}
.core-lbl{position:absolute;font-family:var(--hud);font-size:10.5px;letter-spacing:1.6px;color:var(--faint);white-space:nowrap}
.core-lbl b{display:block;font-size:17px;font-weight:600;color:var(--text);letter-spacing:.5px}
.nucleo-foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.chip-sys{display:inline-flex;align-items:center;gap:7px;font-family:var(--hud);font-size:10.5px;letter-spacing:1.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 11px;background:rgba(4,14,32,.6)}

/* fila (agenda) */
.fila-it{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s}
.fila-it:hover{background:rgba(30,155,255,.06);border-color:var(--line)}
.fila-it .hr{font-family:var(--hud);font-size:13px;color:var(--muted);width:54px;flex:0 0 auto}
.fila-it .g{flex:1;min-width:0}
.fila-it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila-it .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:6px;font-family:var(--hud);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}

/* estoque */
.est{padding:10px 0;border-bottom:1px solid var(--line)}
.est:last-child{border-bottom:none}
.est .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:7px}
.est .t span:last-child{font-family:var(--hud);color:var(--muted)}
.trilho{height:6px;border-radius:4px;background:rgba(92,225,255,.08);overflow:hidden}
.trilho i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px rgba(63,224,255,.6);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.est.baixo .trilho i{background:linear-gradient(90deg,#B3122F,var(--red));box-shadow:0 0 12px rgba(255,59,92,.7);animation:alerta 1.6s ease-in-out infinite}
.est.baixo .t span:last-child{color:var(--red)}
@keyframes alerta{50%{opacity:.55}}

/* gráfico */
.graf{position:relative}
.graf svg{width:100%;height:auto;display:block;overflow:visible}
.graf .risco{stroke-dasharray:1400;stroke-dashoffset:1400;animation:desenha 1.4s .25s cubic-bezier(.4,.2,.2,1) forwards}
@keyframes desenha{to{stroke-dashoffset:0}}
.graf .area{opacity:0;animation:surge .8s 1s ease forwards}
.graf .pto{opacity:0;animation:surge .4s ease forwards}
@keyframes surge{to{opacity:1}}
.tip{position:absolute;pointer-events:none;background:rgba(4,14,32,.95);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 0 20px rgba(30,155,255,.3);transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .15s}
.tip b{font-family:var(--hud);display:block;font-size:14px}
.leg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.leg i{display:inline-block;width:14px;height:2px;margin-right:6px;vertical-align:middle;box-shadow:0 0 6px currentColor}

/* calendário */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-h b{font-family:var(--hud);letter-spacing:2.4px;font-size:14px;flex:1;text-align:center}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-g .ds{font-family:var(--hud);font-size:10.5px;color:var(--faint);text-align:center;padding:4px 0}
.dia{position:relative;aspect-ratio:1;border-radius:50%;border:1px solid transparent;background:none;color:var(--muted);font-family:var(--hud);font-size:13px;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s}
.dia:hover{border-color:var(--line2);color:var(--text)}
.dia.fora{opacity:.28}
.dia.hoje{color:var(--text);border-color:var(--cyan);box-shadow:0 0 12px rgba(63,224,255,.45),inset 0 0 8px rgba(63,224,255,.2)}
.dia.sel{background:var(--blue);color:#fff;border-color:var(--blue);transform:scale(1.08)}
.dia .pontos{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);display:flex;gap:2px}
.dia .pontos i{width:4px;height:4px;border-radius:50%;background:var(--spark);box-shadow:0 0 5px var(--spark)}
.dia.sel .pontos i{background:#fff}
.cal-dia{overflow:hidden;animation:expande .35s cubic-bezier(.2,.8,.2,1)}
@keyframes expande{from{opacity:0;transform:scaleY(.9);transform-origin:top}to{opacity:1;transform:none}}

/* ---------- componentes gerais ---------- */
.tb{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid var(--line2);background:rgba(30,155,255,.06);color:var(--text);transition:border-color .2s,box-shadow .2s,background .2s,transform .12s;text-decoration:none}
.tb:hover{border-color:var(--cyan);box-shadow:0 0 16px rgba(63,224,255,.25);background:rgba(30,155,255,.12)}
.tb:active{transform:scale(.98)}
.tb.pri{background:linear-gradient(180deg,#27A6FF,#1478E0);border-color:#4FC0FF;color:#fff;box-shadow:0 6px 20px -6px rgba(30,155,255,.7)}
.tb.pri:hover{box-shadow:0 0 24px rgba(63,224,255,.55)}
.tb.perigo{color:var(--red);border-color:rgba(255,59,92,.35);background:rgba(255,59,92,.05)}
.tb.perigo:hover{border-color:var(--red);box-shadow:0 0 16px rgba(255,59,92,.3)}
.tb.min{padding:7px 12px;font-size:13px}
.tb svg{width:16px;height:16px}
.onda{position:absolute;border-radius:50%;background:rgba(63,224,255,.45);transform:scale(0);animation:onda .55s ease-out forwards;pointer-events:none}
@keyframes onda{to{transform:scale(4);opacity:0}}
.lk{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:3px 0;text-decoration:underline;text-underline-offset:3px}
.lk:hover{color:var(--cyan)}
.lk.perigo{color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dir{margin-left:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sep{border-top:1px solid var(--line);margin:16px 0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .p13{font-size:13px}
.vazio{text-align:center;color:var(--muted);padding:34px 14px;font-size:14px}
.vazio .lbl{display:block;margin-bottom:8px}

label.f{display:block}
label.f>span{display:block;font-family:var(--hud);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.dica,label.f>span.dica{display:block;font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;color:var(--faint);margin:5px 0 0}
input,select,textarea{width:100%;background:rgba(2,8,20,.75);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,224,255,.12)}
input.num{font-family:var(--hud);font-size:16px}
select option{background:#061428}
textarea{resize:vertical;min-height:74px}
.campo{display:flex;align-items:center;gap:8px;background:rgba(2,8,20,.75);border:1px solid var(--line);border-radius:10px;padding:0 12px;transition:border-color .2s,box-shadow .2s}
.campo:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,224,255,.12)}
.campo input{border:none;background:none;padding:11px 0;box-shadow:none!important}
.campo .u{font-family:var(--hud);font-size:12px;color:var(--faint);white-space:nowrap}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--blue)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 13px;font-family:var(--hud);font-size:12px;letter-spacing:1px;cursor:pointer;white-space:nowrap;transition:all .2s}
.chip:hover{border-color:var(--line2);color:var(--text)}
.chip.on{background:rgba(30,155,255,.18);border-color:var(--cyan);color:var(--text);box-shadow:0 0 12px rgba(63,224,255,.2)}

.it{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background .2s,border-color .2s}
.it:hover{background:rgba(30,155,255,.06);border-color:var(--line)}
.it .g{flex:1;min-width:0}
.it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .nr{font-family:var(--hud);font-size:12px;color:var(--faint);margin-right:6px}
.it .val{text-align:right;flex:0 0 auto}
.it .val b{font-family:var(--hud);font-size:16px;color:var(--cyan);display:block}
.thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;background:rgba(30,155,255,.08);border:1px solid var(--line);flex:0 0 auto}

.tabela{width:100%;border-collapse:collapse;font-size:14px}
.tabela th{text-align:left;font-family:var(--hud);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabela td{padding:12px 10px;border-bottom:1px solid var(--line)}
.tabela tr:last-child td{border-bottom:none}
.tabela .r{text-align:right}
.rolar{overflow-x:auto}

/* resultado do preço */
.preco-big{font-family:var(--hud);font-size:42px;font-weight:700;color:var(--cyan);letter-spacing:-.5px;line-height:1.05;text-shadow:0 0 22px rgba(63,224,255,.35)}
.li{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.li span:first-child{color:var(--muted)}
.li span:last-child{font-family:var(--hud)}
.cam{margin-bottom:11px}
.cam .li{padding:0 0 5px}
.cam .bar{height:3px;border-radius:2px;margin-bottom:2px;box-shadow:0 0 6px currentColor;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(1,4,12,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:36px 16px calc(36px + env(safe-area-inset-bottom,0px));animation:surge .2s ease forwards}
.md{width:100%;max-width:980px;animation:abre .32s cubic-bezier(.2,.8,.2,1)}
.md.est{max-width:720px}
@keyframes abre{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.md-h{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.md-h h2{margin:0;font-family:var(--hud);font-size:18px;letter-spacing:2px;flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:rgba(2,8,20,.7);color:var(--text);font-size:20px;line-height:1;cursor:pointer}
.x:hover{border-color:var(--red);color:var(--red)}
.md-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
.fluxo{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
.fluxo button{flex:1;min-width:84px;border:1px solid var(--line);background:rgba(2,8,20,.6);color:var(--faint);font-family:var(--hud);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:9px 6px;border-radius:8px;cursor:pointer;transition:all .2s}
.fluxo button:hover{color:var(--text);border-color:var(--line2)}
.fluxo button.on{color:#fff;box-shadow:0 0 14px var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent)}

.fotos{display:flex;gap:10px;flex-wrap:wrap}
.foto{position:relative;width:92px;height:92px;border-radius:12px;overflow:hidden;border:1px solid var(--line2)}
.foto img{width:100%;height:100%;object-fit:cover}
.foto button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(2,8,20,.85);color:#fff;cursor:pointer}
.foto-add{width:92px;height:92px;border-radius:12px;border:1px dashed var(--line2);background:none;color:var(--muted);cursor:pointer;font-size:13px}
.foto-add:hover{border-color:var(--cyan);color:var(--cyan)}
.passos{margin:0;padding:0;list-style:none;counter-reset:p}
.passos li{counter-increment:p;position:relative;padding:7px 0 7px 32px;font-size:14px;color:var(--muted)}
.passos li::before{content:counter(p);position:absolute;left:0;top:7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--hud);font-size:11px;color:var(--cyan)}
.passos b{color:var(--text)}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:rgba(6,20,42,.96);border:1px solid var(--line2);color:var(--text);border-radius:12px;padding:12px 18px;font-size:14px;box-shadow:0 0 30px rgba(30,155,255,.35);max-width:90vw;animation:abre .25s ease}

/* navegação inferior (celular) */
.bnav{display:none}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:90;background:rgba(4,12,28,.98);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:sobe .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}


/* login */
.login{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 500px at 50% 20%,rgba(30,155,255,.14),transparent 65%),var(--void)}
.login[hidden]{display:none}
.login .pn{width:min(400px,100%)}
.login-top{display:grid;justify-items:center;gap:10px;margin-bottom:22px;text-align:center}
.login-top img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 36px rgba(30,155,255,.4)}
.login-msg{font-size:13px;color:var(--muted);margin:12px 0 0;min-height:18px}
.login-msg.erro{color:var(--red)}
/* pedido vindo do site */
.req{background:rgba(242,138,20,.06);border:1px solid rgba(242,138,20,.32);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.req p{margin:6px 0 0;white-space:pre-line}
.link-cli{display:flex;gap:8px;align-items:center;background:rgba(2,8,20,.7);border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;margin-top:14px}
.link-cli code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--hud);font-size:12px;color:var(--muted)}
.acao-dest{border-color:var(--spark)!important;box-shadow:0 0 18px rgba(242,138,20,.35)!important}

/* ---------- responsivo ---------- */
@media (max-width:1280px){
  .meio{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .meio .nucleo{grid-column:1/-1;grid-row:1}
}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .baixo{grid-template-columns:1fr}
}
@media (max-width:1024px){
  :root{--side:0px}
  .side{display:none}
  .top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
  .top h1{font-size:16px;letter-spacing:3px}
  .top .marca-m{display:block}
  main.pg{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(2,8,20,.94);border-top:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .bnav button{display:grid;justify-items:center;gap:3px;background:none;border:none;color:var(--faint);font-family:var(--hud);font-size:10px;letter-spacing:1px;cursor:pointer;padding:4px 0}
  .bnav button svg{width:21px;height:21px}
  .bnav button.on{color:var(--cyan)}
  .bnav button.on svg{filter:drop-shadow(0 0 5px var(--cyan))}
  .bnav .fab{margin-top:-22px}
  .bnav .fab span.c{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#27A6FF,#1478E0);color:#fff;box-shadow:0 0 22px rgba(30,155,255,.6);border:1px solid #4FC0FF}
  .md-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .top-dir .online span.t,.top .sub{display:none}
  .relogio .h{font-size:18px}
  /* no celular a tela inicial vira uma pilha pensada para o polegar */
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px}
  .kpi .v{font-size:21px}
  .kpi svg.spark{display:none}
  .meio{grid-template-columns:1fr}
  .nucleo{min-height:0;padding:14px}
  .core{width:min(300px,86vw)}
  .g2,.g3{grid-template-columns:1fr}
  .preco-big{font-size:36px}
  .ov{padding:0;align-items:flex-end}
  .md{max-width:none}
  .md>.pn{border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:1025px){ .marca-m{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .pt{display:none}
}
</style>

<script>
"use strict";

/* ================================================================
   1. DADOS — agora no Supabase
   Cada tabela guarda o registro em "dados" (jsonb) no mesmo formato
   que o painel sempre usou. Só pedidos têm colunas extras
   (número, status, link secreto do cliente).
   ================================================================ */
const CFG = window.RAZENLAB_CONFIG || {};
const CONFIGURADO = !!(CFG.url && CFG.anonKey && !/COLE-AQUI/.test(CFG.url + CFG.anonKey));
const sb = (CONFIGURADO && window.supabase) ? window.supabase.createClient(CFG.url, CFG.anonKey) : null;
const LOGO = document.getElementById("logo-src").src;

const CONFIG_PADRAO = {
  precoFilamento: 120, potencia: 200, precoKwh: 0.92, valorImpressora: 2000, vidaUtil: 5000,
  manutencaoHora: 0.5, horaTrabalho: 30, taxaFalha: 8, margem: 60, taxaPagamento: 0, horasDia: 12,
  embComp: 20, embLarg: 15, embAlt: 10, embPeso: 150   // caixa padrão para cotar frete (cm e gramas)
};
const NEGOCIO_PADRAO = {
  nome:"RazenLab",
  slogan:"Peças personalizadas, presentes, protótipos e reposições. Você manda a ideia ou o arquivo, eu cuido do resto.",
  sobre:"Conte o que você precisa. O orçamento chega com frete para todo o Brasil e pagamento por Pix.",
  whatsapp:"", instagram:"", email:"", cidade:"", responsavel:"",
  pagamento:"Pix. A produção começa após a confirmação do pagamento.",
  validadeDias:7, entregas:"",
  pixTipo:"celular", pixChave:"", pixNome:"", pixCidade:"",
  cepOrigem:""
};
const STATUS = {
  solicitado: { rotulo:"Solicitado",  cor:"#3FE0FF" },
  orcamento:  { rotulo:"Orçamento",   cor:"#8FA8C8" },
  comprovante:{ rotulo:"Comprovante", cor:"#F2C14E" },
  pago:       { rotulo:"Pago",        cor:"#1E9BFF" },
  imprimindo: { rotulo:"Imprimindo",  cor:"#F28A14" },
  pronto:     { rotulo:"Pronto",      cor:"#9B8BFF" },
  enviado:    { rotulo:"Enviado",     cor:"#4FD1C5" },
  entregue:   { rotulo:"Entregue",    cor:"#3FD9A4" },
  cancelado:  { rotulo:"Cancelado",   cor:"#FF3B5C" }
};
const FLUXO = ["solicitado","orcamento","comprovante","pago","imprimindo","pronto","enviado","entregue"];
const CONSOME_FILAMENTO = ["imprimindo","pronto","enviado","entregue"];
const FATURADO = ["pago","imprimindo","pronto","enviado","entregue"];     // já recebeu o dinheiro
const AGUARDA_PAGAMENTO = ["orcamento","comprovante"];

// todo orçamento novo começa daqui: tudo zerado, 1 unidade
const PECA_ZERO = { peca:"", qtd:1, peso:0, horas:0, minutos:0, acabamento:0, extras:0, entrega:0, filamentoId:"" };

let dados = { config:{...CONFIG_PADRAO}, negocio:{...NEGOCIO_PADRAO}, filamentos:[], pedidos:[] };
let vitrine = [];
let tempoReal = false;

/* linha do banco ⇄ objeto do painel */
function pedidoDaLinha(r){ return { ...r.dados, id:r.id, numero:r.numero, token:r.token, status:r.status, criadoEm:r.criado_em, atualizadoEm:r.atualizado_em }; }
function linhaDoPedido(p){
  const d = {...p}; ["id","numero","token","status","criadoEm","atualizadoEm"].forEach(k => delete d[k]);
  return { status:p.status, cliente:p.cliente || null, dados:d };
}
const filDaLinha = r => ({ estoque:null, minimo:200, ...r.dados, id:r.id });
const vitDaLinha = r => ({ ...r.dados, id:r.id, visivel:r.visivel, destaque:r.destaque, fotos:r.fotos || [] });

function erroTexto(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || "");
  if(/Failed to fetch|NetworkError|network/i.test(m)) return "Sem conexão com a internet.";
  if(/JWT|expired|not authenticated/i.test(m)) return "Sua sessão expirou. Entre de novo.";
  return m || "Erro desconhecido.";
}
function falhou(e, acao){ console.error(acao, e); toast(`Não consegui ${acao}: ${erroTexto(e)}`); }

async function carregarTudo(){
  const [cfg, fil, ped, vit] = await Promise.all([
    sb.from("config").select("dados").eq("id",1).maybeSingle(),
    sb.from("filamentos").select("id,dados,criado_em").order("criado_em"),
    sb.from("pedidos").select("id,numero,token,status,dados,criado_em,atualizado_em").order("numero",{ascending:false}),
    sb.from("vitrine").select("id,visivel,destaque,dados,fotos,criado_em").order("criado_em",{ascending:false})
  ]);
  for(const r of [cfg,fil,ped,vit]) if(r.error) throw r.error;
  const c = (cfg.data && cfg.data.dados) || {};
  dados.config = {...CONFIG_PADRAO, ...(c.config||{})};
  dados.negocio = {...NEGOCIO_PADRAO, ...(c.negocio||{})};
  dados.filamentos = fil.data.map(filDaLinha);
  dados.pedidos = ped.data.map(pedidoDaLinha);
  vitrine = vit.data.map(vitDaLinha);
}
async function recarregarPedidos(){
  const r = await sb.from("pedidos").select("id,numero,token,status,dados,criado_em,atualizado_em").order("numero",{ascending:false});
  if(r.error) throw r.error;
  dados.pedidos = r.data.map(pedidoDaLinha);
}
async function gravarConfig(){
  const n = dados.negocio;
  const r1 = await sb.from("config").upsert({ id:1, dados:{ config:dados.config, negocio:n } });
  if(r1.error) throw r1.error;
  // só o que é público vai para o site
  const r2 = await sb.from("site").upsert({ id:1, dados:{ nome:n.nome, slogan:n.slogan, sobre:n.sobre, whatsapp:n.whatsapp, instagram:n.instagram, email:n.email, cidade:n.cidade, entregas:n.entregas } });
  if(r2.error) throw r2.error;
}
async function gravarFilamento(f){
  const {id, ...d} = f;
  const r = await sb.from("filamentos").upsert({ id, dados:d }).select("id").single();
  if(r.error) throw r.error;
  f.id = r.data.id;
}
async function gravarPedido(p){
  const linha = linhaDoPedido(p);
  const r = p.id
    ? await sb.from("pedidos").update(linha).eq("id", p.id).select().single()
    : await sb.from("pedidos").insert(linha).select().single();
  if(r.error) throw r.error;
  return pedidoDaLinha(r.data);
}

/* aviso em tempo real: pedido novo ou comprovante chegando */
let tRecarga;
function ligarTempoReal(){
  sb.channel("pedidos-painel")
    .on("postgres_changes", { event:"*", schema:"public", table:"pedidos" }, ev => {
      const n = ev.new || {};
      if(ev.eventType === "INSERT" && n.status === "solicitado") toast(`Nova solicitação ${numPed(n.numero)} — ${n.cliente || "cliente"}.`);
      if(ev.eventType === "UPDATE" && n.status === "comprovante" && ev.old && ev.old.status !== "comprovante") toast(`Comprovante recebido no pedido ${numPed(n.numero)}.`);
      clearTimeout(tRecarga);
      tRecarga = setTimeout(async () => {
        try{ await recarregarPedidos(); if(!document.querySelector("#modal .ov")) render(); else desenharNav(); }catch(e){}
      }, 400);
    })
    .subscribe(st => { tempoReal = st === "SUBSCRIBED"; desenharNav(); });
}

/* arquivo enviado (data URL) → armazenamento do Supabase */
async function subirImagem(bucket, dataURL){
  const blob = await (await fetch(dataURL)).blob();
  const nome = `${crypto.randomUUID()}.jpg`;
  const r = await sb.storage.from(bucket).upload(nome, blob, { contentType:"image/jpeg", upsert:false });
  if(r.error) throw r.error;
  return sb.storage.from(bucket).getPublicUrl(nome).data.publicUrl;
}
async function linkPrivado(caminho){
  // "comprovantes/arquivo.jpg" → link temporário (10 min) que só o admin consegue gerar
  const i = caminho.indexOf("/");
  const r = await sb.storage.from(caminho.slice(0,i)).createSignedUrl(caminho.slice(i+1), 600);
  if(r.error) throw r.error;
  return r.data.signedUrl;
}
const linkCliente = p => new URL(`pedido.html?t=${p.token}`, location.href).href;

/* ================================================================
   2. APOIO
   ================================================================ */
function num(v){
  if(typeof v === "number") return isFinite(v) ? v : 0;
  if(v == null) return 0;
  let s = String(v).trim().replace(/\s|R\$/g,"");
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g,"");
  s = s.replace(",",".");
  const x = parseFloat(s);
  return isFinite(x) ? x : 0;
}
const brl = v => (isFinite(v)?v:0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dec = (v,c=1) => (isFinite(v)?v:0).toLocaleString("pt-BR",{minimumFractionDigits:c,maximumFractionDigits:c});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const hoje = () => iso(new Date());

/* ================================================================
   3. PREÇO — todas as fórmulas do sistema estão aqui
   ================================================================ */
function precificar(p, cfg = dados.config){
  const horas = num(p.horas) + num(p.minutos)/60;
  const qtd = Math.max(1, Math.round(num(p.qtd)) || 1);
  const fil = dados.filamentos.find(f => f.id === p.filamentoId);
  const precoKg = fil ? num(fil.precoKg) : num(cfg.precoFilamento);

  // produção de uma peça: filamento, energia, desgaste da máquina e seu tempo
  const material = (num(p.peso)/1000) * precoKg;
  const energia  = (num(cfg.potencia)/1000) * horas * num(cfg.precoKwh);
  const depreciacao = num(cfg.vidaUtil) > 0 ? (num(cfg.valorImpressora)/num(cfg.vidaUtil)) * horas : 0;
  const maquina  = depreciacao + num(cfg.manutencaoHora) * horas;
  const trabalho = (num(p.acabamento)/60) * num(cfg.horaTrabalho);
  const extras   = num(p.extras);
  const direto   = material + energia + maquina + trabalho;

  // reserva para reimpressões e margem incidem só sobre a produção
  const falha = direto * (num(cfg.taxaFalha)/100);
  const comMargem = (direto + falha) * (1 + num(cfg.margem)/100);

  // taxa de recebimento somada por fora; extras entram pelo valor pago
  const t = Math.min(Math.max(num(cfg.taxaPagamento),0),90)/100;
  const custo = direto + falha + extras;
  let preco = comMargem/(1 - t) + extras;

  const manual = num(p.precoManual);
  if(manual > 0) preco = manual;
  preco = Math.round(preco*100)/100;   // centavos certos no orçamento

  const taxa  = preco * t;
  const lucro = preco - taxa - custo;
  const entrega = num(p.entrega);
  const desconto = Math.max(0, num(p.desconto));
  const total = Math.max(0, preco*qtd - desconto) + entrega;

  return {
    horas, qtd, precoKg, fil, material, energia, maquina, trabalho, extras, falha,
    custo, taxa, lucro, preco, manual: manual > 0, entrega, desconto, total,
    custoTotal: custo*qtd + entrega,
    lucroTotal: lucro*qtd - desconto,
    horasTotal: horas*qtd,
    filamentoTotal: num(p.peso)*qtd,
    margemReal: preco > 0 ? ((lucro*qtd - desconto)/(preco*qtd))*100 : 0
  };
}


/* ================================================================
   4. ESTOQUE DE FILAMENTO
   Quando um pedido entra em impressão, o filamento sai do estoque.
   Se voltar atrás ou for cancelado, o filamento volta.
   Devolve os filamentos alterados, para gravar no banco.
   ================================================================ */
function ajustarEstoque(p){
  const mudou = new Set();
  const dev = p.estoqueBaixado;
  if(dev){
    const f = dados.filamentos.find(x => x.id === dev.id);
    if(f && f.estoque != null){ f.estoque = num(f.estoque) + num(dev.g); mudou.add(f); }
    delete p.estoqueBaixado;
  }
  if(CONSOME_FILAMENTO.includes(p.status) && p.filamentoId){
    const f = dados.filamentos.find(x => x.id === p.filamentoId);
    const g = num(p.peso) * Math.max(1, num(p.qtd));
    if(f && f.estoque != null && g > 0){ f.estoque = num(f.estoque) - g; p.estoqueBaixado = { id:f.id, g }; mudou.add(f); }
  }
  return [...mudou];
}

function chaveMes(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function ultimosMeses(n){
  const out = [], d = new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){ const x = new Date(d.getFullYear(), d.getMonth()-i, 1); out.push({ k:chaveMes(x), rot:MES_CURTO[x.getMonth()] }); }
  return out;
}
function resumoMes(k){
  const l = dados.pedidos.filter(p => FATURADO.includes(p.status) && (p.dataPago||"").startsWith(k));
  return { qtd:l.length, fat:l.reduce((s,p)=>s+num(p.total),0), lucro:l.reduce((s,p)=>s+num(p.lucroTotal),0), pecas:l.reduce((s,p)=>s+num(p.qtd),0) };
}
const abertos = () => dados.pedidos.filter(p => !["entregue","cancelado"].includes(p.status));
const emProducao = () => dados.pedidos.filter(p => ["pago","imprimindo","pronto"].includes(p.status));
const aguardando = () => dados.pedidos.filter(p => AGUARDA_PAGAMENTO.includes(p.status));
const atrasado = p => p.prazo && p.prazo < hoje() && ["pago","imprimindo","pronto"].includes(p.status);
function ocupacao(){
  const fila = dados.pedidos.filter(p => ["pago","imprimindo"].includes(p.status)).reduce((s,p)=>s+num(p.horasTotal),0);
  const cap = Math.max(1, num(dados.config.horasDia)) * 7;
  return { fila, pct: Math.min(100, fila/cap*100) };
}

/* números contando até o valor final */
function animarNumeros(raiz){
  raiz.querySelectorAll("[data-conta]").forEach(el => {
    const alvo = num(el.dataset.conta), tipo = el.dataset.tipo || "int";
    const fmt = v => tipo==="brl" ? brl(v) : tipo==="h" ? dec(v)+" h" : tipo==="pct" ? dec(v,0)+"%" : Math.round(v).toLocaleString("pt-BR");
    if(reduzMov || alvo === 0){ el.textContent = fmt(alvo); return; }
    const ini = performance.now(), dur = 900;
    const passo = t => { const k = Math.min(1,(t-ini)/dur), e = 1-Math.pow(1-k,3); el.textContent = fmt(alvo*e); if(k<1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
  raiz.querySelectorAll("[data-largura]").forEach(el => requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = el.dataset.largura; })));
}

  b.appendChild(o); setTimeout(()=>o.remove(), 600);
});

/* gráfico holográfico de linhas */
let graficos = {};
function graficoHolo(id, rotulos, series, alt = 230){
  const W = 640, H = alt, pl = 58, pr = 16, pt = 14, pb = 30;
  // teto do eixo arredondado (100, 250, 500, 1.000…) para os valores ficarem legíveis
  const bruto = Math.max(1, ...series.flatMap(s => s.vals)) * 1.1;
  const pot = Math.pow(10, Math.floor(Math.log10(bruto)));
  const max = [1, 2, 2.5, 5, 10].map(k => k*pot).find(v => v >= bruto);
  const x = i => pl + (rotulos.length === 1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(rotulos.length-1));
  const y = v => pt + (H-pt-pb) * (1 - v/max);
  const curto = v => v >= 1000 ? "R$ " + dec(v/1000, v>=10000?0:1) + "k" : "R$ " + Math.round(v);
  let grade = "";
  for(let i=0;i<=4;i++){
    const v = max*i/4, yy = y(v);
    grade += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="rgba(92,225,255,${i===0?.25:.08})" stroke-dasharray="${i===0?"":"3 5"}"/>
      <text x="${pl-10}" y="${yy+4}" text-anchor="end" font-family="Chakra Petch, Segoe UI, Arial, sans-serif" font-size="11" fill="#56708F">${curto(v)}</text>`;
  }
  const eixoX = rotulos.map((r,i) => `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-family="Chakra Petch, Segoe UI, Arial, sans-serif" font-size="11" fill="#56708F">${r}</text>`).join("");
  const linhas = series.map((s,si) => {
    const pts = s.vals.map((v,i) => [x(i), y(v)]);
    const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const area = d + ` L${pts[pts.length-1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z`;
    return `
      <defs><linearGradient id="ga-${id}-${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.cor}" stop-opacity=".28"/><stop offset="1" stop-color="${s.cor}" stop-opacity="0"/></linearGradient></defs>
      <path class="area" d="${area}" fill="url(#ga-${id}-${si})"/>
      <path class="risco" d="${d}" fill="none" stroke="${s.cor}" stroke-width="2.2" stroke-linejoin="round" filter="url(#gneon-${id})" style="animation-delay:${.25+si*.2}s"/>
      ${pts.map((p,i) => `<circle class="pto" cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#02060F" stroke="${s.cor}" stroke-width="2" style="animation-delay:${1+i*.06}s"/>`).join("")}`;
  }).join("");
  const alvos = rotulos.map((r,i) => `<rect x="${x(i)-(W-pl-pr)/rotulos.length/2}" y="${pt}" width="${(W-pl-pr)/rotulos.length}" height="${H-pt-pb}" fill="transparent" data-gi="${i}"/>`).join("");
  graficos[id] = { rotulos, series, x, y, W, H };
  return `
  <div class="graf" id="graf-${id}">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${series.map(s=>s.nome).join(" e ")}">
      <defs><filter id="gneon-${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      ${grade}${eixoX}${linhas}
      <line id="guia-${id}" y1="${pt}" y2="${H-pb}" stroke="rgba(63,224,255,.35)" stroke-dasharray="2 3" opacity="0"/>
      ${alvos}
    </svg>
    <div class="tip" id="tip-${id}"></div>
  </div>
  <div class="leg">${series.map(s => `<span><i style="background:${s.cor};color:${s.cor}"></i>${s.nome}</span>`).join("")}</div>`;
}
document.addEventListener("pointermove", e => {
  const r = e.target.closest && e.target.closest("[data-gi]");
  document.querySelectorAll(".graf").forEach(g => {
    const id = g.id.slice(5), gr = graficos[id]; if(!gr) return;
    const tip = document.getElementById("tip-"+id), guia = document.getElementById("guia-"+id);
    if(!r || !g.contains(r)){ tip.style.opacity = 0; guia.setAttribute("opacity",0); return; }
    const i = +r.dataset.gi, svg = g.querySelector("svg"), esc2 = svg.getBoundingClientRect().width / gr.W;
    const topo = Math.min(...gr.series.map(s => gr.y(s.vals[i])));
    tip.innerHTML = `<span class="lbl">${gr.rotulos[i]}</span>` + gr.series.map(s => `<b style="color:${s.cor}">${brl(s.vals[i])}</b>`).join("");
    tip.style.left = (gr.x(i)*esc2)+"px"; tip.style.top = (topo*esc2)+"px"; tip.style.opacity = 1;
    guia.setAttribute("x1", gr.x(i)); guia.setAttribute("x2", gr.x(i)); guia.setAttribute("opacity",1);
  });
});
function sparkSVG(vals, cor = "var(--cyan)"){
  const max = Math.max(1, ...vals), W = 96, H = 34;
  const pts = vals.map((v,i) => [i*(W-4)/(vals.length-1)+2, H-3-(H-8)*v/max]);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${cor}" stroke-width="1.6" style="filter:drop-shadow(0 0 3px ${cor})"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.5" fill="${cor}"/></svg>`;
}

/* calendário de prazos */
let calRef = new Date(); calRef.setDate(1);
let diaSel = hoje();
function calendario(){
  const a = calRef.getFullYear(), m = calRef.getMonth();
  const ini = new Date(a, m, 1), iniGrade = new Date(a, m, 1 - ini.getDay());
  const prazos = {};
  dados.pedidos.filter(p => p.prazo && !["cancelado","entregue"].includes(p.status)).forEach(p => { prazos[p.prazo] = (prazos[p.prazo]||0) + 1; });
  let dias = "";
  for(let i=0;i<42;i++){
    const d = new Date(iniGrade.getFullYear(), iniGrade.getMonth(), iniGrade.getDate()+i), k = iso(d);
    if(i >= 35 && d.getMonth() !== m) break;
    const n = prazos[k] || 0;
    dias += `<button class="dia ${d.getMonth()!==m?"fora":""} ${k===hoje()?"hoje":""} ${k===diaSel?"sel":""}" data-dia="${k}" aria-label="${dataBR(k)}${n?`, ${n} entrega${n>1?"s":""}`:""}">${d.getDate()}${n?`<span class="pontos">${"<i></i>".repeat(Math.min(n,3))}</span>`:""}</button>`;
  }
  const doDia = dados.pedidos.filter(p => p.prazo === diaSel && p.status !== "cancelado");
  return `
    <div class="cal-h">
      <button class="x" data-mes="-1" aria-label="Mês anterior" style="font-size:0">${ico("seta",'style="width:16px;height:16px"')}</button>
      <b>${MESES[m]} ${a}</b>
      <button class="x" data-mes="1" aria-label="Próximo mês" style="font-size:0">${ico("seta2",'style="width:16px;height:16px"')}</button>
    </div>
    <div class="cal-g">${["D","S","T","Q","Q","S","S"].map(x=>`<div class="ds">${x}</div>`).join("")}${dias}</div>
    <div class="cal-dia" key="${diaSel}">
      <div class="sep" style="margin:14px 0 8px"></div>
      <div class="lbl" style="margin-bottom:6px">ENTREGAS EM ${dataBR(diaSel)}</div>
      ${doDia.length ? doDia.map(p => `<div class="fila-it" data-abrir="${p.id}"><div class="g"><div class="n">${esc(p.peca||"Peça")}</div><div class="s">${esc(p.cliente||"Sem cliente")}</div></div>${stLed(p.status)}</div>`).join("")
        : `<p class="p13 faint" style="margin:6px 0 0">Nenhuma entrega marcada neste dia.</p>`}
    </div>`;
}

    const d = (p.criadoEm||"").slice(0,10); if(d > c.ultimo) c.ultimo = d;
  });
  return Object.values(m).sort((a,b) => b.gasto - a.gasto);
}

async function salvarPedido(silencioso, mudarStatus){
  if(ocupado) return null;
  const form = document.getElementById("ped-form");
  if(mudarStatus) form.querySelector('[name="status"]').value = mudarStatus;
  const p = montarPedido();
  if(!p.peca){ toast("Dê um nome para a peça antes de salvar."); form.querySelector('[name="peca"]').focus(); return null; }
  ocupado = true;
  const mudou = ajustarEstoque(p);
  try{
    const salvo = await gravarPedido(p);
    for(const f of mudou) await gravarFilamento(f);
    const i = dados.pedidos.findIndex(x => x.id === salvo.id);
    if(i >= 0) dados.pedidos[i] = salvo; else dados.pedidos.unshift(salvo);
    pedidoAberto = salvo;
    const baixo = mudou.find(f => num(f.estoque) <= num(f.minimo));
    if(!silencioso){ fecharModal(); render(); toast(`Pedido ${numPed(salvo.numero)} salvo.` + (baixo ? ` Atenção: ${baixo.nome} com estoque baixo.` : "")); }
    return salvo;
  }catch(e){
    falhou(e, "salvar o pedido");
    try{ await carregarTudo(); }catch(_){}
    return null;
  }finally{ ocupado = false; }
}

/* cotação de frete pelo Melhor Envio (função "frete" no Supabase) */
let opcoesFrete = [];
async function cotarFrete(botao){
  const f = document.getElementById("ped-form"), v = lerCampos(f), c = precificar(v), cfg = dados.config;
  const origem = String(dados.negocio.cepOrigem||"").replace(/\D/g,""), destino = String(v.cep||"").replace(/\D/g,"");
  const caixa = document.getElementById("frete-opcoes");
  if(origem.length !== 8){ toast("Cadastre o CEP de onde você envia em Configurações → Seu negócio."); return; }
  if(destino.length !== 8){ toast("Preencha o CEP do cliente."); f.querySelector('[name="cep"]').focus(); return; }
  botao.disabled = true; botao.textContent = "Cotando…"; caixa.innerHTML = "";
  try{
    const { data, error } = await sb.functions.invoke("frete", { body:{
      de:origem, para:destino,
      pesoKg:(c.filamentoTotal + num(cfg.embPeso)) / 1000,
      comprimento:num(cfg.embComp), largura:num(cfg.embLarg), altura:num(cfg.embAlt),
      valorDeclarado:Math.max(0, c.total - c.entrega)
    }});
    if(error){
      let msg = error.message;
      try{ const j = await error.context.json(); if(j && j.erro) msg = j.erro; }catch(_){}
      throw new Error(/Failed to send|fetch/i.test(msg) ? "A função de frete ainda não foi publicada no Supabase." : msg);
    }
    opcoesFrete = data.opcoes || [];
    caixa.innerHTML = opcoesFrete.length ? `<div class="grid" style="margin-top:10px">${opcoesFrete.map((o,i) => `
      <button type="button" class="it" data-frete-opcao="${i}" style="width:100%;background:rgba(2,8,20,.6);border-color:var(--line);text-align:left;color:inherit">
        <div class="g"><div class="n">${esc(o.empresa)} ${esc(o.servico)}</div><div class="s">${o.prazo?`${o.prazo} dia${o.prazo>1?"s":""} úteis`:"prazo não informado"}</div></div>
        <div class="val"><b>${brl(o.preco)}</b></div></button>`).join("")}</div>
      <p class="dica">Caixa ${dec(num(cfg.embComp),0)}×${dec(num(cfg.embLarg),0)}×${dec(num(cfg.embAlt),0)} cm · ${dec((c.filamentoTotal+num(cfg.embPeso))/1000,2)} kg. Ajuste a caixa padrão em Configurações.</p>`
      : `<p class="dica">Nenhuma transportadora atende esse CEP com essa caixa.</p>`;
  }catch(e){ toast("Frete: " + erroTexto(e)); }
  finally{ botao.disabled = false; botao.textContent = "Cotar frete pelo CEP"; }
}

async function buscarCep(cep, preencher){

   13. CÓPIA, IMPORTAÇÃO E MIGRAÇÃO DOS DADOS DESTE APARELHO
   ================================================================ */
function baixar(nome, conteudo){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo],{type:"application/json"})); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function exportar(){
  baixar(`razenlab-copia-${hoje()}.json`, JSON.stringify({ ...dados, vitrine, versao:3, exportadoEm:new Date().toISOString() }, null, 1));
  toast("Cópia gerada.");
}
function lerLocal(){
  try{ return JSON.parse(localStorage.getItem("razenlab.v1") || localStorage.getItem("atelie3d.v1") || "null"); }catch(e){ return null; }
}
function temDadosLocais(){
  if(localStorage.getItem("razenlab.migrado")) return false;
  const d = lerLocal();
  return !!(d && ((d.pedidos||[]).length || (d.filamentos||[]).length));
}
function bannerMigracao(){
  if(!temDadosLocais()) return "";
  const d = lerLocal();
  return `<div class="pn rv" style="--d:20ms;margin-bottom:16px;border-color:var(--cyan);display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <i class="led pulsa" style="color:var(--cyan)"></i>
    <span style="flex:1;min-width:220px">Encontrei <b>${(d.pedidos||[]).length} pedidos</b> e <b>${(d.filamentos||[]).length} filamentos</b> salvos só neste aparelho, da versão anterior.</span>
    <button class="tb pri min" data-acao="migrar">Migrar para a nuvem</button></div>`;
}
function lerVitrineLocal(){
  return new Promise(ok => {
    try{
      const r = indexedDB.open("razenlab", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => { try{ const g = r.result.transaction("kv").objectStore("kv").get("vitrine"); g.onsuccess = () => ok(g.result || []); g.onerror = () => ok([]); }catch(e){ ok([]); } };
      r.onerror = () => ok([]);
    }catch(e){ ok([]); }
  });
}
async function migrarDados(d, vitAntiga){
  if(ocupado) return; ocupado = true;
  toast("Migrando… não feche a página.");
  try{
    // custos e dados do negócio: o que já está na nuvem tem prioridade; o antigo preenche o que falta
    dados.config = { ...CONFIG_PADRAO, ...(d.config||{}), ...Object.fromEntries(Object.entries(dados.config).filter(([k,v]) => v !== CONFIG_PADRAO[k])) };
    const neg = { ...(d.negocio||{}) }; Object.entries(dados.negocio).forEach(([k,v]) => { if(v !== "" && v != null && v !== NEGOCIO_PADRAO[k]) neg[k] = v; });
    dados.negocio = { ...NEGOCIO_PADRAO, ...neg };
    await gravarConfig();

    const mapa = {};
    for(const f of (d.filamentos||[])){
      const novo = { nome:f.nome, material:f.material||"", cor:f.cor||"", precoKg:num(f.precoKg), estoque: f.estoque == null ? null : num(f.estoque), minimo: f.minimo == null ? 200 : num(f.minimo) };
      await gravarFilamento(novo); mapa[f.id] = novo.id;
    }
    const antigos = (d.pedidos||[]).slice().sort((a,b) => (a.numero||0) - (b.numero||0));
    let n = 0;
    for(const p of antigos){
      const q = { ...p };
      q.status = q.status === "aprovado" ? "pago" : (STATUS[q.status] ? q.status : "orcamento");
      q.filamentoId = mapa[p.filamentoId] || "";
      if(p.estoqueBaixado && mapa[p.estoqueBaixado.id]) q.estoqueBaixado = { id:mapa[p.estoqueBaixado.id], g:p.estoqueBaixado.g }; else delete q.estoqueBaixado;
      if(FATURADO.includes(q.status) && !q.dataPago) q.dataPago = q.dataEntregue || (p.criadoEm||"").slice(0,10) || hoje();
      delete q.valorPago;
      const linha = { ...linhaDoPedido(q), numero:p.numero || undefined, criado_em:p.criadoEm || undefined };
      let r = await sb.from("pedidos").insert(linha);
      if(r.error && /duplicate|unique/i.test(r.error.message)){ delete linha.numero; r = await sb.from("pedidos").insert(linha); }
      if(r.error) throw r.error;
      n++;
    }
    await sb.rpc("admin_ajustar_numeracao");

    let v = 0;
    for(const t of (vitAntiga||[])){
      await gravarTrabalho({ ...t, id:null }); v++;
    }
    localStorage.setItem("razenlab.migrado", new Date().toISOString());
    await carregarTudo(); render();
    toast(`Pronto: ${n} pedidos, ${Object.keys(mapa).length} filamentos e ${v} trabalhos agora estão na nuvem.`);
  }catch(e){
    falhou(e, "terminar a migração");
    try{ await carregarTudo(); render(); }catch(_){}
  }finally{ ocupado = false; }
}
function importar(arq){
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.pedidos)) throw 0;
      if(!confirm(`Importar ${d.pedidos.length} pedidos deste arquivo para a nuvem? Use só se ainda não importou este backup.`)) return;
      await migrarDados(d, Array.isArray(d.vitrine) ? d.vitrine : []);
    }catch(e){ toast("Esse arquivo não é um backup do painel."); }
  };
  r.onerror = () => toast("Não foi possível ler o arquivo.");
  r.readAsText(arq);
}

function mostrarLogin(msg, erro){
  document.getElementById("boot").classList.add("fim");
  document.getElementById("login").hidden = false;
  const m = document.getElementById("login-msg");
  m.innerHTML = msg || ""; m.classList.toggle("erro", !!erro);
}
async function iniciarSessao(){
  const adm = await sb.rpc("is_admin");
  if(adm.error) throw adm.error;
  if(!adm.data){
    await sb.auth.signOut();
    mostrarLogin("Esta conta existe, mas ainda não tem acesso ao painel. Rode o arquivo <b>02_admin.sql</b> com o seu e-mail no Supabase.", true);
    return;
  }
  await carregarTudo();
  document.getElementById("login").hidden = true;
  ligarTempoReal();
  render();
  inicializar();
}
document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  btn.disabled = true; btn.textContent = "Entrando…";
  const r = await sb.auth.signInWithPassword({ email:document.getElementById("login-email").value.trim(), password:document.getElementById("login-senha").value });
  if(r.error){
    mostrarLogin(/invalid/i.test(r.error.message) ? "E-mail ou senha incorretos." : erroTexto(r.error), true);
  }else{
    try{ await iniciarSessao(); }catch(err){ mostrarLogin(erroTexto(err), true); }
  }
  btn.disabled = false; btn.textContent = "Entrar";
});

   ================================================================ */
document.addEventListener("click", async e => {
  const t = e.target; let el;
  if((el = t.closest("[data-ir]"))){ if(el.dataset.filtroIr) filtroStatus = el.dataset.filtroIr; ir(el.dataset.ir); return; }
  if(t.hasAttribute("data-fechar")){ fecharModal(); return; }
  if((el = t.closest("[data-filtro]"))){ filtroStatus = el.dataset.filtro; render(); return; }
  if((el = t.closest("[data-abrir]"))){ abrirPedido(dados.pedidos.find(p => p.id === el.dataset.abrir)); return; }
  if((el = t.closest("[data-status]"))){
    const f = document.getElementById("ped-form");
    f.querySelector('[name="status"]').value = el.dataset.status;
    f.querySelectorAll("[data-status]").forEach(b => b.classList.toggle("on", b === el));
    return;
  }
  if((el = t.closest("[data-arquivo]"))){ abrirArquivo(el.dataset.arquivo); return; }
  if((el = t.closest("[data-frete-opcao]"))){ escolherFrete(+el.dataset.freteOpcao); return; }
  if((el = t.closest("[data-copiar]"))){
    try{ await navigator.clipboard.writeText(el.dataset.copiar); toast("Link copiado."); }catch(err){ prompt("Copie o link:", el.dataset.copiar); }
    return;
  }
  if((el = t.closest("[data-dia]"))){ diaSel = el.dataset.dia; document.getElementById("cal").innerHTML = calendario(); return; }
  if((el = t.closest("[data-mes]"))){ calRef = new Date(calRef.getFullYear(), calRef.getMonth() + (+el.dataset.mes), 1); document.getElementById("cal").innerHTML = calendario(); return; }
  if((el = t.closest("[data-cliente]"))){ busca = el.dataset.cliente; filtroStatus = "todos"; ir("pedidos"); return; }
  if((el = t.closest("[data-trabalho]"))){ abrirTrabalho(vitrine.find(v => v.id === el.dataset.trabalho)); return; }
  if((el = t.closest("[data-del-foto]"))){ guardarTrabalho(); trabalhoAberto.fotos.splice(+el.dataset.delFoto,1); desenharTrabalho(); return; }
  if((el = t.closest("[data-edit-fil]"))){ abrirFilamento(el.dataset.editFil); return; }
  if((el = t.closest("[data-rolo]"))){
    const f = dados.filamentos.find(x => x.id === el.dataset.rolo);
    f.estoque = num(f.estoque) + 1000;
    try{ await gravarFilamento(f); render(); toast(`+1 kg em ${f.nome}.`); }catch(err){ f.estoque -= 1000; falhou(err, "atualizar o estoque"); }
    return;
  }
  if(!(el = t.closest("[data-acao]"))) return;

  switch(el.dataset.acao){
    case "novo": abrirPedido(null); break;
    case "zerar": simulacao = {...PECA_ZERO}; render(); break;
    case "simular-para-pedido": {
      const v = lerCampos(document.getElementById("sim-form"));
      if(precificar(v).preco <= 0){ toast("Preencha peso e tempo antes de criar o pedido."); break; }
      abrirPedido({ ...PECA_ZERO, ...v, id:null, cliente:"", contato:"", email:"", status:"orcamento", prazo:"", obs:"", recado:"", precoManual:"", desconto:0, cep:"", endereco:{}, rastreio:"" });
      simulacao = {...PECA_ZERO};
      break;
    }
    case "salvar-pedido": salvarPedido(false); break;
    case "cotar-frete": cotarFrete(el); break;
    case "enviar-orcamento": enviarOrcamento(); break;
    case "confirmar-pagamento": confirmarPagamento(); break;
    case "marcar-enviado": marcarEnviado(); break;
    case "avisar-envio": abrirWhats(pedidoAberto.contato, textoEnvio(pedidoAberto)); break;
    case "gerar-orcamento": gerarOrcamento(); break;
    case "duplicar": {
      const c = {...montarPedido(), id:null, numero:null, token:null, status:"orcamento", prazo:"", rastreio:""};
      ["dataPago","dataEnviado","dataEntregue","criadoEm","estoqueBaixado","comprovante","comprovanteEm","pedidoCliente","anexo","origem"].forEach(k => delete c[k]);
      abrirPedido(c); toast("Cópia aberta. Ajuste e salve.");
      break;
    }
    case "para-vitrine": {
      const p = await salvarPedido(true); if(!p) break;
      abrirTrabalho(null); Object.assign(trabalhoAberto, { titulo:p.peca, material:p.materialTexto||"" });
      desenharTrabalho(); toast("Adicione as fotos da peça.");
      break;
    }
    case "excluir-pedido":
      if(confirm("Excluir este pedido? Não dá para desfazer.")){
        const p = { ...pedidoAberto, status:"cancelado" };
        const mudou = ajustarEstoque(p);   // devolve o filamento antes de apagar
        try{
          const r = await sb.from("pedidos").delete().eq("id", p.id); if(r.error) throw r.error;
          for(const f of mudou) await gravarFilamento(f);
          dados.pedidos = dados.pedidos.filter(x => x.id !== p.id);
          fecharModal(); render(); toast("Pedido excluído.");
        }catch(err){ falhou(err, "excluir o pedido"); await carregarTudo(); }
      }
      break;
    case "add-filamento": {
      const f = lerCampos(document.getElementById("fil-form"));
      if(!f.nome.trim()){ toast("Dê um nome ao filamento."); break; }
      const novo = { nome:f.nome.trim(), material:f.material.trim(), cor:f.cor.trim(), precoKg:num(f.precoKg), estoque: String(f.estoque).trim()==="" ? null : num(f.estoque), minimo:num(f.minimo) };
      try{ await gravarFilamento(novo); dados.filamentos.push(novo); render(); toast("Filamento cadastrado."); }catch(err){ falhou(err, "cadastrar o filamento"); }
      break;
    }
    case "salvar-fil": {
      const box = document.getElementById("fil-edit"), f = dados.filamentos.find(x => x.id === box.dataset.id), v = lerCampos(box);
      if(!v.nome.trim()){ toast("Dê um nome ao filamento."); break; }
      const novo = { ...f, nome:v.nome.trim(), material:v.material.trim(), cor:v.cor.trim(), precoKg:num(v.precoKg), estoque: String(v.estoque).trim()==="" ? null : num(v.estoque), minimo:num(v.minimo) };
      try{ await gravarFilamento(novo); Object.assign(f, novo); fecharModal(); render(); toast("Filamento atualizado."); }catch(err){ falhou(err, "salvar o filamento"); }
      break;
    }
    case "excluir-fil": {
      const id = document.getElementById("fil-edit").dataset.id;
      if(confirm("Excluir este filamento? Pedidos antigos passam a usar o preço padrão.")){
        const r = await sb.from("filamentos").delete().eq("id", id);
        if(r.error){ falhou(r.error, "excluir o filamento"); break; }
        dados.filamentos = dados.filamentos.filter(x => x.id !== id); fecharModal(); render();
      }
      break;
    }
    case "novo-trabalho": abrirTrabalho(null); break;
    case "add-foto": guardarTrabalho(); document.getElementById("arq-fotos").click(); break;
    case "salvar-trabalho": {
      guardarTrabalho(); const w = trabalhoAberto;
      if(!String(w.titulo).trim()){ toast("Dê um título ao trabalho."); break; }
      if(!w.fotos.length){ toast("Adicione pelo menos uma foto."); break; }
      if(ocupado) break; ocupado = true;
      el.disabled = true; el.textContent = "Enviando fotos…";
      try{
        w.titulo = w.titulo.trim(); w.categoria = String(w.categoria||"").trim();
        const salvo = await gravarTrabalho(w);
        const i = vitrine.findIndex(v => v.id === salvo.id);
        if(i >= 0) vitrine[i] = salvo; else vitrine.unshift(salvo);
        fecharModal(); aba = "vitrine"; render(); toast(salvo.visivel ? "Publicado no site." : "Salvo (oculto no site).");
      }catch(err){ falhou(err, "salvar o trabalho"); el.disabled = false; el.textContent = "Salvar e publicar"; }
      finally{ ocupado = false; }
      break;
    }
    case "excluir-trabalho":
      if(confirm("Excluir este trabalho do site?")){
        const w = trabalhoAberto;
        const r = await sb.from("vitrine").delete().eq("id", w.id);
        if(r.error){ falhou(r.error, "excluir o trabalho"); break; }
        const nomes = (w.fotos||[]).map(caminhoVitrine).filter(Boolean);
        if(nomes.length) sb.storage.from("vitrine").remove(nomes);
        vitrine = vitrine.filter(v => v.id !== w.id); fecharModal(); render();
      }
      break;
    case "salvar-negocio": {
      const v = lerCampos(document.getElementById("neg-form"));
      const antes = { ...dados.negocio };
      Object.keys(v).forEach(k => { dados.negocio[k] = k === "validadeDias" ? num(v[k]) : String(v[k]).trim(); });
      dados.negocio.pixChave = normalizarChave(dados.negocio.pixTipo, dados.negocio.pixChave);
      try{ await gravarConfig(); render(); toast("Dados salvos. O site já mostra as mudanças."); }catch(err){ dados.negocio = antes; falhou(err, "salvar os dados"); }
      break;
    }
    case "salvar-config": {
      const v = lerCampos(document.getElementById("cfg-form")), antes = { ...dados.config };
      Object.keys(CONFIG_PADRAO).forEach(k => { if(k in v) dados.config[k] = num(v[k]); });
      try{ await gravarConfig(); toast("Custos salvos."); }catch(err){ dados.config = antes; falhou(err, "salvar os custos"); }
      break;
    }
    case "exportar": exportar(); break;
    case "importar": document.getElementById("arq-backup").click(); break;
    case "migrar": {
      const d = lerLocal(); if(!d){ toast("Nenhum dado antigo neste aparelho."); break; }
      if(!confirm(`Enviar ${(d.pedidos||[]).length} pedidos deste aparelho para a nuvem?`)) break;
      await migrarDados(d, await lerVitrineLocal());
      break;
    }
    case "sair":
      if(confirm("Sair do painel neste aparelho?")){ await sb.auth.signOut(); location.reload(); }
      break;
  }
});

/* chave Pix no formato que os bancos leem no QR Code */
function normalizarChave(tipo, chave){
  const c = String(chave||"").trim();
  if(tipo === "celular"){ const d = c.replace(/\D/g,""); return d.length >= 10 && d.length <= 11 ? "+55"+d : d.length >= 12 ? "+"+d : c; }
  if(tipo === "cpf") return c.replace(/\D/g,"");
  return c.toLowerCase();
}

document.addEventListener("input", e => {
  if(e.target.id === "busca"){ busca = e.target.value; document.getElementById("lista-pedidos").innerHTML = listaPedidos(); return; }
  if(e.target.closest("#ped-form")){
    if(e.target.name === "entrega" && e.isTrusted){ const h = document.querySelector('#ped-form [name="freteServico"]'); if(h) h.value = ""; const s = document.getElementById("frete-escolhido"); if(s) s.textContent = "Frete digitado à mão."; }
    atualizarPedido();
  }
  if(e.target.closest("#sim-form")) atualizarSimulador();
});
document.addEventListener("change", async e => {
  if(e.target.closest("#ped-form")) atualizarPedido();
  if(e.target.closest("#sim-form")) atualizarSimulador();
  if(e.target.matches("[data-cep]")){
    const f = document.getElementById("ped-form");
    buscarCep(e.target.value, end => Object.entries(end).forEach(([k,v]) => { const i = f.querySelector(`[name="end_${k}"]`); if(i && !i.value && v) i.value = v; }));
  }
  if(e.target.id === "arq-backup" && e.target.files[0]){ importar(e.target.files[0]); e.target.value = ""; }
  if(e.target.id === "arq-fotos" && e.target.files.length && trabalhoAberto){
    const arqs = [...e.target.files].slice(0, 4 - trabalhoAberto.fotos.length);
    toast("Preparando fotos…");
    for(const a of arqs){ try{ trabalhoAberto.fotos.push(await comprimirFoto(a)); }catch(err){ toast("Uma imagem não pôde ser lida."); } }
    e.target.value = ""; desenharTrabalho();
  }
});
document.addEventListener("focusin", e => {

});
document.addEventListener("keydown", e => { if(e.key === "Escape") fecharModal(); });

  tique(); setInterval(tique, 10000);
  if(!CONFIGURADO){

    mostrarLogin("O painel ainda não está ligado ao Supabase. Preencha o arquivo <b>config.js</b> com a Project URL e a chave anon public (Supabase → Project Settings → API).", true);

})();
